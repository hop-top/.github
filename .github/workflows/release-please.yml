name: release-please

on:
  push:
    branches: [main]
  # Manual trigger for re-running release-please after sibling-component
  # PR conflicts force a rebase, or whenever the bot's standing PRs need
  # to be rebuilt against current main without waiting for the next push.
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          token: ${{ secrets.GH_RELEASE_PLEASE_PAT }}
