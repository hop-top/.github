name: goreleaser-on-tag (reusable)

# Runs GoReleaser on a tag push, working around two limitations of
# GoReleaser OSS (both Pro-only fixes):
#
#   1. `monorepo:` tag-prefix stripping — needed so {{.Version}}
#      and {{.Tag}} resolve cleanly under `<component>/v<version>`
#      tags. We synthesize a local `v<bare>` tag at the same commit
#      and feed it via GORELEASER_CURRENT_TAG.
#   2. `release.tag:` override — needed so GoReleaser uploads to a
#      release with a tag name different from the synthesized one.
#      We sidestep by having adopters set `release.disable: true`
#      and uploading dist/* to the real prefixed tag via `gh
#      release upload` in a separate step here.
#
# Net effect for adopters: their .goreleaser.yaml uses stock
# {{.Version}} and {{.Tag}} (both resolve to the bare v<semver>),
# disables GoReleaser's own release publishing, and gets a
# Homebrew formula whose URL points at the real prefixed tag via
# {{ .Env.RELEASE_TAG }} — the one env var still needed for that
# specific spot. Full template: docs/binaries/go.md.
#
# Both `<component>/v<version>` and plain `v<version>` tag shapes
# work — same workflow, no caller config to tune.

on:
  workflow_call:
    inputs:
      goreleaser-config:
        description: Path to the GoReleaser config (default `.goreleaser.yaml`)
        type: string
        default: ".goreleaser.yaml"
      goreleaser-version:
        description: GoReleaser version constraint (passed to goreleaser-action)
        type: string
        default: "~> v2"
      go-version:
        description: Go toolchain version
        type: string
        default: "1.26"
      homebrew-tap-repo:
        description: |
          Bare repo name (NOT slug) of the Homebrew tap to push
          formulae to. The tap is assumed to live under the same
          owner as the caller repo. Required if caller's
          GoReleaser config has a `brews:` block — the release-bot
          App token will be scoped to allow writes here in addition
          to the caller repo. Example: `homebrew-tap`.
        type: string
        default: ""
    secrets:
      RELEASE_BOT_APP_ID:
        description: |
          App ID of the hop-top release-bot GitHub App. Org-level
          secret; the App must be installed on the caller repo
          (and on `homebrew-tap-repo` if set).
        required: true
      RELEASE_BOT_PRIVATE_KEY:
        description: |
          Private key for the release-bot App. Org-level secret,
          pairs with `RELEASE_BOT_APP_ID`.
        required: true
    outputs:
      bare-version:
        description: The semver derived from the tag (no `v`, no component prefix)
        value: ${{ jobs.goreleaser.outputs.bare-version }}
      release-tag:
        description: The literal git tag that triggered the workflow
        value: ${{ jobs.goreleaser.outputs.release-tag }}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      bare-version: ${{ steps.tag.outputs.bare }}
      release-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Mandatory per DEVELOPING.md rule 1: without this, the
          # runner plants github-actions[bot] credentials in git
          # config and silently overrides any subsequent PAT-based
          # push (e.g. the Homebrew tap update).
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}

      # Derive the bare semver from the tag, accepting both
      # `<component>/v<version>` and plain `v<version>` shapes.
      # Examples:
      #   refs/tags/usp/v0.1.0-alpha.1 → bare=0.1.0-alpha.1
      #   refs/tags/kit-ts/v0.4.0      → bare=0.4.0
      #   refs/tags/v1.2.3             → bare=1.2.3
      - id: tag
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          tag="${REF#refs/tags/}"
          bare="${tag##*/v}"
          # If no `/v` was found, ${tag##*/v} returns the full tag
          # unchanged. Fall back to stripping a leading `v`.
          if [ "$bare" = "$tag" ]; then
            bare="${tag#v}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "bare=$bare" >> "$GITHUB_OUTPUT"
          echo "Parsed tag=$tag bare=$bare"

      # Synthesize a local `v<bare>` git tag at the same commit and
      # tell GoReleaser to use it via GORELEASER_CURRENT_TAG. Without
      # this, GoReleaser fails at "parsing tag" because the real
      # `<component>/v<version>` shape is not valid semver. The
      # synthesized tag is local-only and never pushed.
      - name: Synthesize bare-version git tag
        env:
          BARE: ${{ steps.tag.outputs.bare }}
          REAL_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "v${BARE}" "${REAL_TAG}"

      # Mint a short-lived installation token from the release-bot
      # GitHub App. Scope to the caller repo plus the optional
      # Homebrew tap repo (needed when .goreleaser.yaml has brews:).
      - id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.homebrew-tap-repo != '' && format('{0},{1}', github.event.repository.name, inputs.homebrew-tap-repo) || github.event.repository.name }}

      # Build artifacts + write Homebrew formula. Adopter's
      # .goreleaser.yaml MUST set `release.disable: true` because
      # GoReleaser OSS can't target a release with a different tag
      # name (the `release.tag:` override is Pro-only). The upload
      # step below attaches dist/* to the real release-please tag.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: ${{ inputs.goreleaser-version }}
          args: release --clean --config ${{ inputs.goreleaser-config }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          HOMEBREW_TAP_TOKEN: ${{ steps.app-token.outputs.token }}
          GORELEASER_CURRENT_TAG: v${{ steps.tag.outputs.bare }}
          BARE_VERSION: ${{ steps.tag.outputs.bare }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}

      # Upload dist/* to the real release-please-created release.
      # Filters to archives + checksum file; skips the loose binary
      # directories GoReleaser writes per-target.
      - name: Upload artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REAL_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.zip dist/checksums.txt)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::no artifacts found in dist/"
            exit 1
          fi
          gh release upload "${REAL_TAG}" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
