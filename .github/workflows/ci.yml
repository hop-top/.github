name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # version-check reads YAML extra-files targets with PyYAML (pinned as
      # in version-check.yml); the preflight's YAML tests use it too.
      - name: Install PyYAML
        run: python -m pip install pyyaml==6.0.3

      - name: Unit tests for scripts/spec
        run: make test-scripts

      - name: Tests for the workflows' inline check scripts
        run: make test-workflows

  release-please-target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/release-please-target/package-lock.json

      - name: Tests for scripts/release-please-target
        run: make test-release-please-target

      - name: Mutation check for scripts/release-please-target
        run: make mutate-release-please-target
