name: release-please-preflight (reusable)

# Pre-merge sanity checks for adopter repos using hop-top/.github's
# release-please + publish-on-tag setup. Reports specific resolution
# steps when something's misconfigured.
#
# Adopter usage (minimal — gets full smart-default checks):
#
#   # .github/workflows/release-please-preflight.yml
#   name: release-please-preflight
#   on:
#     pull_request:
#       paths:
#         - '.github/release-please-config.json'
#         - '.github/.release-please-manifest.json'
#         - '.github/workflows/release-please.yml'
#         - '.github/workflows/publish.yml'
#         - 'pyproject.toml'
#         - 'package.json'
#         - 'Cargo.toml'
#     workflow_dispatch: {}
#   jobs:
#     preflight:
#       uses: hop-top/.github/.github/workflows/release-please-preflight.yml@v0
#
# Override examples:
#
#   with:
#     fail-on: any              # default 'breaking' — also fails on warnings
#     config-path: custom/path  # default '.github/release-please-config.json'

on:
  workflow_call:
    inputs:
      fail-on:
        description: |
          When to exit non-zero.
            breaking - only fail on broken config / missing infra (default)
            any      - also fail on informational warnings
            never    - annotation-only; always exit 0
        type: string
        default: breaking
      config-path:
        description: Path to release-please-config.json (default .github/release-please-config.json)
        type: string
        default: .github/release-please-config.json
      manifest-path:
        description: Path to manifest (default .github/.release-please-manifest.json)
        type: string
        default: .github/.release-please-manifest.json
      publish-workflow-path:
        description: Path to caller publish.yml (default .github/workflows/publish.yml)
        type: string
        default: .github/workflows/publish.yml
      release-please-workflow-path:
        description: Path to caller release-please.yml (default .github/workflows/release-please.yml)
        type: string
        default: .github/workflows/release-please.yml

jobs:
  first-publish-risk:
    # Probes each component's target registry to detect names that
    # have never been published yet. First publishes through CI fail
    # for scoped tokens (npm/PyPI/crates.io) — emit a warning with
    # the bootstrap command so the adopter resolves it BEFORE merging
    # the standing release-please PR.
    #
    # Runs in parallel with `preflight` (no `needs:`) so the slowest
    # network probe doesn't gate the rest of the checks.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Probe registries for first-publish risk
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          PUBLISH_PATH: ${{ inputs.publish-workflow-path }}
        run: |
          set -euo pipefail
          {
            echo "## first-publish registry probe"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ ! -f "$CONFIG_PATH" ]]; then
            echo "[INFO] release-please-config.json not found at $CONFIG_PATH; skipping probe" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! jq empty "$CONFIG_PATH" 2>/dev/null; then
            echo "[INFO] $CONFIG_PATH is not valid JSON; skipping probe (preflight job will report)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Pre-parse publish.yml the same way the preflight job does — restore
          # the root `on` key that PyYAML mangles into True, and decode the
          # `ecosystems` string block into structured JSON for jq.
          PUBLISH_JSON=""
          if [[ -f "$PUBLISH_PATH" ]]; then
            PUBLISH_JSON="$RUNNER_TEMP/publish.json"
            python3 - <<'PY'
          import json, os, sys
          import yaml

          def _restore_root_on_key(doc):
              if not isinstance(doc, dict):
                  return doc
              if True in doc and "on" not in doc:
                  doc["on"] = doc.pop(True)
              if False in doc and "off" not in doc:
                  doc["off"] = doc.pop(False)
              return doc

          path = os.environ["PUBLISH_PATH"]
          with open(path, "r", encoding="utf-8") as f:
              doc = yaml.safe_load(f) or {}
          doc = _restore_root_on_key(doc)
          try:
              eco_str = doc.get("jobs", {}).get("publish", {}).get("with", {}).get("ecosystems")
              if isinstance(eco_str, str):
                  doc["jobs"]["publish"]["with"]["ecosystems"] = yaml.safe_load(eco_str) or {}
          except Exception as exc:
              print(f"warning: could not pre-decode ecosystems: {exc}", file=sys.stderr)
          with open(os.environ["RUNNER_TEMP"] + "/publish.json", "w", encoding="utf-8") as f:
              json.dump(doc, f)
          PY
          else
            echo "[INFO] publish.yml not found at $PUBLISH_PATH; probing config-only ecosystems via release-type only" >> "$GITHUB_STEP_SUMMARY"
          fi

          WARNINGS=0
          # Walk each component in release-please-config.json. Pull its name
          # / ecosystem from publish.yml when present; otherwise infer from
          # release-please's release-type (node|python|rust|php).
          for path in $(jq -r '.packages // {} | keys[]' "$CONFIG_PATH"); do
            COMPONENT=$(jq -r --arg p "$path" '.packages[$p].component // empty' "$CONFIG_PATH")
            RELEASE_TYPE=$(jq -r --arg p "$path" '.packages[$p]["release-type"] // .["release-type"] // empty' "$CONFIG_PATH")

            ECOSYSTEM=""
            PACKAGE=""
            if [[ -n "$PUBLISH_JSON" && -n "$COMPONENT" ]]; then
              ECOSYSTEM=$(jq -r --arg c "$COMPONENT" '.jobs.publish.with.ecosystems[$c].ecosystem // empty' "$PUBLISH_JSON" 2>/dev/null || echo "")
              PACKAGE=$(jq -r --arg c "$COMPONENT" '.jobs.publish.with.ecosystems[$c].package // empty' "$PUBLISH_JSON" 2>/dev/null || echo "")
            fi

            # Fallback ecosystem inference when publish.yml is absent or has no
            # matching entry. Best-effort only — without a `package` value we
            # cannot probe, so skip the probe but record the gap.
            if [[ -z "$ECOSYSTEM" ]]; then
              case "$RELEASE_TYPE" in
                node)    ECOSYSTEM=ts ;;
                python)  ECOSYSTEM=py ;;
                rust)    ECOSYSTEM=rs ;;
                php)     ECOSYSTEM=php ;;
                go)      ECOSYSTEM=go ;;
                *)       continue ;;
              esac
            fi

            # Resolve PACKAGE from the manifest path when publish.yml didn't give one.
            if [[ -z "$PACKAGE" ]]; then
              case "$ECOSYSTEM" in
                ts)
                  if [[ -f "$path/package.json" ]]; then
                    PACKAGE=$(jq -r '.name // empty' "$path/package.json")
                  fi
                  ;;
                py)
                  if [[ -f "$path/pyproject.toml" ]]; then
                    PACKAGE=$(python3 - "$path/pyproject.toml" <<'PY'
          import sys
          try:
              import tomllib
          except ImportError:
              import tomli as tomllib
          with open(sys.argv[1], "rb") as f:
              doc = tomllib.load(f)
          name = (doc.get("project") or {}).get("name") or (
              doc.get("tool", {}).get("poetry", {}) or {}
          ).get("name") or ""
          print(name)
          PY
                    )
                  fi
                  ;;
                rs)
                  if [[ -f "$path/Cargo.toml" ]]; then
                    PACKAGE=$(python3 - "$path/Cargo.toml" <<'PY'
          import sys
          try:
              import tomllib
          except ImportError:
              import tomli as tomllib
          with open(sys.argv[1], "rb") as f:
              doc = tomllib.load(f)
          print((doc.get("package") or {}).get("name") or "")
          PY
                    )
                  fi
                  ;;
                php)
                  if [[ -f "$path/composer.json" ]]; then
                    PACKAGE=$(jq -r '.name // empty' "$path/composer.json")
                  fi
                  ;;
              esac
            fi

            if [[ -z "$PACKAGE" ]]; then
              echo "[INFO] component '${COMPONENT:-$path}' ($ECOSYSTEM): could not resolve package name; skipping probe" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            case "$ECOSYSTEM" in
              ts)
                ENCODED=$(printf '%s' "$PACKAGE" | sed 's|/|%2F|g')
                HTTP=$(curl -s --max-time 10 -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/$ENCODED")
                if [[ "$HTTP" == "404" ]]; then
                  MSG="Package $PACKAGE not on npm yet. First publish via CI may fail; bootstrap manually first: scripts/bootstrap-first-publish.sh npm"
                  echo "::warning::$MSG"
                  echo "[WARN]  $MSG" >> "$GITHUB_STEP_SUMMARY"
                  WARNINGS=$((WARNINGS+1))
                elif [[ "$HTTP" == "200" ]]; then
                  echo "[OK]    npm: $PACKAGE exists" >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "[INFO] npm probe for $PACKAGE returned HTTP $HTTP" >> "$GITHUB_STEP_SUMMARY"
                fi
                ;;
              py)
                HTTP=$(curl -s --max-time 10 -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/$PACKAGE/json")
                if [[ "$HTTP" == "404" ]]; then
                  MSG="Package $PACKAGE not on PyPI yet. First publish via CI may fail; bootstrap manually first: scripts/bootstrap-first-publish.sh pypi"
                  echo "::warning::$MSG"
                  echo "[WARN]  $MSG" >> "$GITHUB_STEP_SUMMARY"
                  WARNINGS=$((WARNINGS+1))
                elif [[ "$HTTP" == "200" ]]; then
                  echo "[OK]    PyPI: $PACKAGE exists" >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "[INFO] PyPI probe for $PACKAGE returned HTTP $HTTP" >> "$GITHUB_STEP_SUMMARY"
                fi
                ;;
              rs)
                # crates.io returns 200 + JSON for both existing and unknown
                # crates; the discriminator is the `versions` array length.
                BODY=$(mktemp)
                HTTP=$(curl -s --max-time 10 -o "$BODY" -w "%{http_code}" "https://crates.io/api/v1/crates/$PACKAGE")
                if [[ "$HTTP" == "200" ]]; then
                  VERSIONS=$(jq -r '.versions // [] | length' "$BODY" 2>/dev/null || echo 0)
                  if [[ "${VERSIONS:-0}" == "0" ]]; then
                    MSG="Package $PACKAGE not on crates.io yet. First publish via CI may fail; bootstrap manually first: scripts/bootstrap-first-publish.sh cargo"
                    echo "::warning::$MSG"
                    echo "[WARN]  $MSG" >> "$GITHUB_STEP_SUMMARY"
                    WARNINGS=$((WARNINGS+1))
                  else
                    echo "[OK]    crates.io: $PACKAGE exists ($VERSIONS versions)" >> "$GITHUB_STEP_SUMMARY"
                  fi
                elif [[ "$HTTP" == "404" ]]; then
                  MSG="Package $PACKAGE not on crates.io yet. First publish via CI may fail; bootstrap manually first: scripts/bootstrap-first-publish.sh cargo"
                  echo "::warning::$MSG"
                  echo "[WARN]  $MSG" >> "$GITHUB_STEP_SUMMARY"
                  WARNINGS=$((WARNINGS+1))
                else
                  echo "[INFO] crates.io probe for $PACKAGE returned HTTP $HTTP" >> "$GITHUB_STEP_SUMMARY"
                fi
                rm -f "$BODY"
                ;;
              php)
                HTTP=$(curl -s --max-time 10 -o /dev/null -w "%{http_code}" "https://packagist.org/packages/$PACKAGE.json")
                if [[ "$HTTP" == "404" ]]; then
                  MSG="Package $PACKAGE not on Packagist yet. First publish via CI may fail; submit manually at https://packagist.org/packages/submit"
                  echo "::warning::$MSG"
                  echo "[WARN]  $MSG" >> "$GITHUB_STEP_SUMMARY"
                  WARNINGS=$((WARNINGS+1))
                elif [[ "$HTTP" == "200" ]]; then
                  echo "[OK]    Packagist: $PACKAGE exists" >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "[INFO] Packagist probe for $PACKAGE returned HTTP $HTTP" >> "$GITHUB_STEP_SUMMARY"
                fi
                ;;
              go)
                echo "[INFO] go: proxy.golang.org pulls from git tag — no first-publish bootstrap needed" >> "$GITHUB_STEP_SUMMARY"
                ;;
              *)
                echo "[INFO] unknown ecosystem '$ECOSYSTEM' for component '${COMPONENT:-$path}'" >> "$GITHUB_STEP_SUMMARY"
                ;;
            esac
          done

          {
            echo ""
            echo "Warnings: $WARNINGS"
          } >> "$GITHUB_STEP_SUMMARY"
          # Annotation-only by design — never fails the job. The main
          # `preflight` job owns the fail-on policy; this probe surfaces
          # advisory signals only.
          exit 0

  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # least privilege — annotations + step summary don't need PR write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false  # avoid auth header side-effects (DEVELOPING.md convention)

      # Pre-parse the adopter's publish.yml into JSON so downstream jq can query it.
      # Matches the python3 + yaml.safe_load pattern used by publish-on-tag.yml —
      # avoids the PEP 668 / externally-managed env brittleness of `sudo pip install yq`.
      # jq is preinstalled on ubuntu-latest; yaml ships in the runner's Python stdlib via PyYAML.
      - name: Parse publish.yml into JSON
        id: parse-publish
        env:
          PUBLISH_PATH: ${{ inputs.publish-workflow-path }}
        run: |
          set -euo pipefail
          if [[ ! -f "$PUBLISH_PATH" ]]; then
            # Emit empty JSON so downstream `jq` calls don't crash — Check 1 will flag the missing file.
            echo '{}' > "$RUNNER_TEMP/publish.json"
            echo "publish_json=$RUNNER_TEMP/publish.json" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          import json, os, sys
          import yaml

          # PyYAML follows YAML 1.1, which resolves unquoted on/off/yes/no/true/false
          # all to Python booleans. GitHub Actions workflow files use `on:` as the
          # top-level trigger key — PyYAML parses that into True, not "on", so
          # doc["on"] is unreachable.
          #
          # Narrow fix: only at the document root, only when `True` is present AND
          # no quoted "on" key already exists. This avoids:
          #   - over-normalizing nested booleans (workflow files don't have boolean
          #     keys at non-root nesting in practice, but be defensive)
          #   - losing the distinction between `true`/`yes`/`on` (all map to True)
          #   - overwriting an existing quoted "on" key if both forms appear
          # Same treatment for False -> "off" at root, since `off` is also a valid
          # (if uncommon) Actions trigger key.
          def _restore_root_on_key(doc):
              if not isinstance(doc, dict):
                  return doc
              if True in doc and "on" not in doc:
                  doc["on"] = doc.pop(True)
              if False in doc and "off" not in doc:
                  doc["off"] = doc.pop(False)
              return doc

          path = os.environ["PUBLISH_PATH"]
          with open(path, "r", encoding="utf-8") as f:
              doc = yaml.safe_load(f) or {}
          doc = _restore_root_on_key(doc)
          # The `ecosystems` field is a string-encoded YAML block (see publish-on-tag.yml's
          # contract). Decode it inline so downstream jq can drill in directly.
          try:
              eco_str = doc.get("jobs", {}).get("publish", {}).get("with", {}).get("ecosystems")
              if isinstance(eco_str, str):
                  doc["jobs"]["publish"]["with"]["ecosystems"] = yaml.safe_load(eco_str) or {}
          except Exception as exc:
              print(f"warning: could not pre-decode ecosystems: {exc}", file=sys.stderr)
          out_path = os.path.join(os.environ["RUNNER_TEMP"], "publish.json")
          with open(out_path, "w", encoding="utf-8") as f:
              json.dump(doc, f)
          PY
          echo "publish_json=$RUNNER_TEMP/publish.json" >> "$GITHUB_OUTPUT"

      # Detect single-language adopters (Go-only / direct-pull registries) so we can
      # demote publish.yml-dependent checks. publish.yml must be absent on disk, and
      # release-please-config.json must either:
      #   - have exactly one entry under .packages, or
      #   - resolve every package to release-type go (the package's own or the
      #     top-level default) — a multi-module Go repo publishes through
      #     proxy.golang.org pulling tags, so it has no publish step at all.
      # Any other multi-package config with no publish.yml is still a misconfig.
      # `go_only` is the narrower second case (no publish.yml, every package
      # go): nothing matches tags against publish.yml's '*/v*' glob, and a
      # nested Go module needs its full directory path as tag prefix.
      - name: Detect single-language adopter
        id: detect
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          PUBLISH_PATH: ${{ inputs.publish-workflow-path }}
        run: |
          set -euo pipefail
          single=false
          go_only=false
          if [[ -f "$CONFIG_PATH" && ! -f "$PUBLISH_PATH" ]]; then
            count=$(jq -r '.packages // {} | length' "$CONFIG_PATH" 2>/dev/null || echo 0)
            all_go=$(jq -r '(.["release-type"] // "") as $top
              | (.packages // {}) as $p
              | ($p | length) > 0 and ($p | all(.[]; (.["release-type"] // $top) == "go"))' \
              "$CONFIG_PATH" 2>/dev/null || echo false)
            if [[ "${count:-0}" == "1" || "$all_go" == "true" ]]; then
              single=true
            fi
            if [[ "$all_go" == "true" ]]; then
              go_only=true
            fi
          fi
          echo "single_lang=$single" >> "$GITHUB_OUTPUT"
          echo "go_only=$go_only" >> "$GITHUB_OUTPUT"

      - name: Run preflight checks
        id: checks
        env:
          FAIL_ON: ${{ inputs.fail-on }}
          CONFIG_PATH: ${{ inputs.config-path }}
          MANIFEST_PATH: ${{ inputs.manifest-path }}
          PUBLISH_PATH: ${{ inputs.publish-workflow-path }}
          RP_PATH: ${{ inputs.release-please-workflow-path }}
          PUBLISH_JSON: ${{ steps.parse-publish.outputs.publish_json }}
          SINGLE_LANG: ${{ steps.detect.outputs.single_lang }}
          GO_ONLY: ${{ steps.detect.outputs.go_only }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # The branch the config is checked for: a pull request's base, or
          # the pushed / dispatched branch (target versioning's records).
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          set -uo pipefail

          BREAKING=0
          WARNING=0

          fail()    { echo "::error::$1"; echo "[BREAK] $1" >> "$GITHUB_STEP_SUMMARY"; BREAKING=$((BREAKING+1)); }
          warn()    { echo "::warning::$1"; echo "[WARN]  $1" >> "$GITHUB_STEP_SUMMARY"; WARNING=$((WARNING+1)); }
          info()    { echo "::notice::$1"; echo "[INFO]  $1" >> "$GITHUB_STEP_SUMMARY"; }
          ok()      { echo "[OK]    $1" >> "$GITHUB_STEP_SUMMARY"; }
          fixhint() { echo "[FIX]   $1" >> "$GITHUB_STEP_SUMMARY"; }

          # extra_files <package>: one `<entry>\t<target>\t<kind>\t<selector>\t<glob>`
          # line per extra-files entry of the package -- the entry as written
          # (a string, or an object's `path`), the repo-root path release-please
          # rewrites, the kind (`string` for the string form; an object's
          # `type` when release-please supports it, `(none)` when unset or
          # empty, else `?<type>` -- an object of type "string" is `?string`),
          # its `jsonpath` (`xpath` for xml) as `=<value>` (`=` alone when
          # empty; `-` when unset) and whether it is a glob.
          # Mirrors release-please's Strategy#addPath: a leading `/` anchors
          # the entry at the repository root, the root package `.` joins
          # nothing, any other package joins its own path. No field is empty:
          # `read` with a tab IFS would merge empty fields.
          extra_files() {
            jq -r --arg p "$1" '
              .packages[$p]["extra-files"] // []
              | .[]
              | (if type == "string" then . else (.path // "") end) as $rel
              | select($rel != "")
              | [$rel,
                 (if ($rel | startswith("/")) or $p == "."
                  then ($rel | sub("^/+"; ""))
                  else ($p | sub("/+$"; "")) + "/" + $rel
                  end),
                 (if type == "string" then "string"
                  elif (.type // "") == "" then "(none)"
                  elif (.type as $t | ["generic", "json", "yaml", "toml", "xml", "pom"] | any(. == $t)) then .type
                  else "?" + (.type | tostring) end),
                 (if type == "object" then (if .type == "xml" then .xpath else .jsonpath end) else null end
                  | if . == null then "-" else "=" + tostring end),
                 (if type == "object" and .glob == true then "true" else "false" end)]
              | @tsv
            ' "$CONFIG_PATH" 2>/dev/null
          }

          # has_annotation <file>: carries a marker release-please's generic
          # updater rewrites (inline x-release-please-<scope>, or a
          # x-release-please-start-<scope> ... x-release-please-end block).
          has_annotation() {
            grep -Eq 'x-release-please-(start-)?(major|minor|patch|version|date)' "$1"
          }

          # extra_file_probe <json|yaml|toml|xml-root> <file> <selector>: reads
          # the value release-please's typed updater would rewrite. Prints
          # `ok\t<value>`, `missing`, `notversion\t<value>` (not a string, or
          # for json not a version string: skipped by release-please's json
          # and yaml updaters, fatal to its toml one but for a boolean),
          # `parse\t<error>`, or `skip\t<reason>` (a jsonpath beyond
          # `$.a.b` / `['a']` / `[n]`, or no parser for the format here).
          # xml-root is release-please's `/*/version`: a `version` child of the
          # root element, no namespace.
          extra_file_probe() {
            python3 - "$@" 2>/dev/null <<'PY' || printf 'skip\tno python3\n'
          import json, re, sys

          kind, path, sel = sys.argv[1:4]
          VERSION = re.compile(r"\d+\.\d+\.\d+(-[\w.]+)?(\+[-\w.]+)?")

          def out(*fields):
              print("\t".join(" ".join(str(f).split()) for f in fields))
              sys.exit(0)

          try:
              if kind == "json":
                  with open(path, encoding="utf-8") as f:
                      docs = [json.load(f)]
              elif kind == "toml":
                  try:
                      import tomllib
                  except ImportError:
                      try:
                          import tomli as tomllib
                      except ImportError:
                          out("skip", "no TOML parser")
                  with open(path, "rb") as f:
                      docs = [tomllib.load(f)]
              elif kind == "yaml":
                  try:
                      import yaml
                  except ImportError:
                      out("skip", "no YAML parser")
                  with open(path, encoding="utf-8") as f:
                      docs = list(yaml.safe_load_all(f))
              else:
                  import xml.etree.ElementTree as ET
                  root = ET.parse(path).getroot()
                  hit = next((c for c in root if c.tag == "version"), None)
                  out("missing") if hit is None else out("ok", (hit.text or "").strip())
          except Exception as exc:
              out("parse", str(exc) or type(exc).__name__)

          steps, rest = [], sel[1:] if sel.startswith("$") else None
          token = re.compile(r"""\.([A-Za-z_$][\w$-]*)|\[(\d+)\]|\['([^']*)'\]|\["([^"]*)"\]""")
          while rest:
              m = token.match(rest)
              if not m:
                  break
              name, index, single, double = m.groups()
              steps.append(int(index) if index is not None else next(
                  g for g in (name, single, double) if g is not None))
              rest = rest[m.end():]
          if rest is None or rest:
              out("skip", "beyond $.a.b / [n] paths")

          found = []
          for doc in docs:
              cur = doc
              for step in steps:
                  if isinstance(step, int) and isinstance(cur, list) and step < len(cur):
                      cur = cur[step]
                  elif isinstance(step, str) and isinstance(cur, dict) and step in cur:
                      cur = cur[step]
                  else:
                      break
              else:
                  found.append(cur)
          if not found:
              out("missing")
          for value in found:
              if isinstance(value, str) and (kind != "json" or VERSION.search(value)):
                  out("ok", value)
          out("notversion", json.dumps(found[0], default=str))
          PY
          }

          # apply_fail_on: runs at the end (and on early-stop paths) so the
          # `fail-on` policy is honored consistently. Never `exit 0` early
          # without going through this.
          apply_fail_on() {
            echo "breaking=$BREAKING" >> "$GITHUB_OUTPUT"
            echo "warning=$WARNING" >> "$GITHUB_OUTPUT"
            case "$FAIL_ON" in
              breaking)
                [[ $BREAKING -gt 0 ]] && exit 1 || exit 0
                ;;
              any)
                [[ $BREAKING -gt 0 || $WARNING -gt 0 ]] && exit 1 || exit 0
                ;;
              never)
                exit 0
                ;;
              *)
                echo "::error::invalid fail-on value: $FAIL_ON (expected: breaking | any | never)"
                exit 2
                ;;
            esac
          }

          {
            echo "## release-please preflight"
            echo ""
            echo "### Files"
          } >> "$GITHUB_STEP_SUMMARY"

          # ---------- Check 1: required files ----------
          if [[ ! -f "$CONFIG_PATH" ]]; then
            fail "release-please config not found at $CONFIG_PATH"
            fixhint "create $CONFIG_PATH per the dotgithub SKILL.md Quick-start section"
          else
            ok "release-please config found ($CONFIG_PATH)"
          fi

          if [[ ! -f "$MANIFEST_PATH" ]]; then
            fail "manifest not found at $MANIFEST_PATH"
            fixhint "create $MANIFEST_PATH with a prerelease-shaped seed, e.g. {\".\": \"0.1.0-alpha.1\"}"
          else
            ok "manifest found ($MANIFEST_PATH)"
          fi

          if [[ ! -f "$PUBLISH_PATH" ]]; then
            if [[ "${SINGLE_LANG:-false}" == "true" ]]; then
              info "publish workflow absent (single-language adopter — proxy.golang.org / direct registry pull)"
            else
              fail "publish workflow not found at $PUBLISH_PATH"
              fixhint "create $PUBLISH_PATH calling hop-top/.github/.github/workflows/publish-on-tag.yml@v0"
            fi
          else
            ok "publish workflow found ($PUBLISH_PATH)"
          fi

          if [[ ! -f "$RP_PATH" ]]; then
            fail "release-please workflow not found at $RP_PATH"
            fixhint "create $RP_PATH calling hop-top/.github/.github/workflows/release-please-on-push.yml@v0 (see references/quick-start.md)"
          else
            ok "release-please workflow found ($RP_PATH)"
          fi

          if [[ $BREAKING -gt 0 ]]; then
            {
              echo ""
              echo "**Stopping: required files missing. Address the above and re-run.**"
            } >> "$GITHUB_STEP_SUMMARY"
            apply_fail_on
          fi

          # ---------- Check 2: release-please-config.json ----------
          {
            echo ""
            echo "### release-please config"
          } >> "$GITHUB_STEP_SUMMARY"

          PACKAGES=""
          if ! jq empty "$CONFIG_PATH" 2>/dev/null; then
            fail "$CONFIG_PATH is not valid JSON"
            fixhint "jq . $CONFIG_PATH  # to see the parse error"
          else
            ok "$CONFIG_PATH parses as JSON"
            PACKAGES=$(jq -r '.packages // {} | keys[]' "$CONFIG_PATH" 2>/dev/null)
            if [[ -z "$PACKAGES" ]]; then
              fail "$CONFIG_PATH has no .packages map"
              fixhint "add a packages block per the dotgithub SKILL.md examples"
            else
              info "packages: $(echo "$PACKAGES" | tr '\n' ' ')"
            fi
          fi

          # ---------- Check 2b: top-level linked-versions ----------
          # release-please reads linked groups only from `plugins`
          # ({"type": "linked-versions", ...}); a top-level `linked-versions`
          # key links nothing. `x-` keys are free-form notes (target
          # versioning's records among them) and pass silently.
          if [[ -n "${PACKAGES:-}" ]] && jq -e 'type == "object" and has("linked-versions")' "$CONFIG_PATH" >/dev/null 2>&1; then
            warn "top-level linked-versions in $CONFIG_PATH is ignored — release-please reads linked groups only from plugins"
            fixhint "move each group into plugins as {\"type\": \"linked-versions\", \"groupName\": ..., \"components\": [...]} (conditional-linked-versions for versioning target), then drop the top-level key"
          fi

          # ---------- Check 3: single-segment component names ----------
          # publish.yml's '*/v*' trigger misses nested tags, so a '/' in a
          # component fails -- except in a Go-only repo (GO_ONLY): there is no
          # publish.yml, and a nested module's tag must be '<dir/path>/vX'.
          if [[ -f "$CONFIG_PATH" && -n "${PACKAGES:-}" ]]; then
            for path in $PACKAGES; do
              COMPONENT=$(jq -r --arg p "$path" '.packages[$p].component // empty' "$CONFIG_PATH")
              if [[ -z "$COMPONENT" ]]; then
                warn "package $path has no .component — tag prefix will be inferred from package-name"
                fixhint "set .packages.\"$path\".component to a single-segment name in $CONFIG_PATH"
                continue
              fi
              if [[ "$COMPONENT" == */* && "${GO_ONLY:-false}" == "true" ]]; then
                ok "component '$COMPONENT' is nested — Go-only repo, tag '$COMPONENT/v<version>' is the module-path tag Go expects (no publish.yml glob)"
              elif [[ "$COMPONENT" == */* ]]; then
                fail "component '$COMPONENT' contains '/' — tag '*/v*' glob does NOT match nested paths"
                fixhint "rename to single-segment in $CONFIG_PATH (e.g. ${COMPONENT//\//-})"
              else
                ok "component '$COMPONENT' is single-segment"
              fi
            done
          fi

          # ---------- Check 4: prerelease four-piece combo ----------
          # `versioning` is `prerelease` (release-please's counter strategy) or
          # `target` (hop-top/.github's extension, Check 4b).
          if [[ -f "$CONFIG_PATH" && -n "${PACKAGES:-}" ]]; then
            {
              echo ""
              echo "### prerelease config"
            } >> "$GITHUB_STEP_SUMMARY"
            for path in $PACKAGES; do
              PRERELEASE=$(jq -r --arg p "$path" '.packages[$p].prerelease // false' "$CONFIG_PATH")
              if [[ "$PRERELEASE" == "true" ]]; then
                PR_TYPE=$(jq -r --arg p "$path" '.packages[$p]["prerelease-type"] // empty' "$CONFIG_PATH")
                VERSIONING=$(jq -r --arg p "$path" '.packages[$p].versioning // .versioning // empty' "$CONFIG_PATH")
                BUMP_MINOR=$(jq -r --arg p "$path" '.packages[$p]["bump-minor-pre-major"] // false' "$CONFIG_PATH")
                MISSING=""
                [[ -z "$PR_TYPE" ]] && MISSING="$MISSING prerelease-type"
                [[ "$VERSIONING" != "prerelease" && "$VERSIONING" != "target" ]] && MISSING="$MISSING versioning"
                [[ "$BUMP_MINOR" != "true" ]] && MISSING="$MISSING bump-minor-pre-major"
                if [[ -n "$MISSING" ]]; then
                  fail "package $path is prerelease but missing:$MISSING"
                  fixhint "all four pieces required — see SKILL.md \"Prerelease channel\""
                else
                  ok "package $path: prerelease four-piece combo complete"
                fi
                if [[ -n "$PR_TYPE" && "$PR_TYPE" != *.* ]]; then
                  warn "package $path prerelease-type '$PR_TYPE' missing counter digit — first release will skip alpha.0 and start at alpha.1"
                  fixhint "change to '$PR_TYPE.0' in $CONFIG_PATH"
                fi
              else
                info "package $path: stable channel (prerelease: false / unset)"
              fi
            done
          fi

          # ---------- Check 4b: target versioning ----------
          # `versioning: "target"` is hop-top/.github's release-please extension
          # (scripts/release-please-target), run by release-please-on-push with
          # `versioning-extension: true`. Needs the target-context plugin (first),
          # well-formed conditional-linked-versions groups of target packages,
          # prerelease-type alpha.0 (every line starts on alpha), no release-as,
          # the owner bump table, and well-formed records (x-channel: a channel
          # promotion for the package's current line; x-open-line: a line to
          # open). The records are checked against the manifest only for a
          # prerelease branch (target-context prereleaseBranches, default next):
          # on a stable or maintenance branch they are inert (main carries
          # next's config as merged) and the runner leaves them alone.
          TARGETS=""
          if [[ -f "$CONFIG_PATH" && -n "${PACKAGES:-}" ]]; then
            TARGETS=$(jq -r '.versioning as $top | [(.packages // {}) | to_entries[] | select((.value.versioning // $top) == "target") | .key] | sort[]' "$CONFIG_PATH" 2>/dev/null)
            OFF=$(jq -r '.versioning as $top | [(.packages // {}) | to_entries[] | select((.value.versioning // $top) != "target")
              | .key as $p | (.value | keys[] | select(. == "x-channel" or . == "x-open-line")) as $k | "\($p)\t\($k)"] | .[]' "$CONFIG_PATH" 2>/dev/null)
            while IFS=$'\t' read -r path key; do
              [[ -n "$path" ]] || continue
              fail "package $path has $key but does not use versioning target"
              fixhint "drop $key, or set versioning: \"target\" for $path"
            done <<<"$OFF"
          fi
          # core_cmp A B: -1 / 0 / 1 comparing x.y.z (any -prerelease ignored)
          core_cmp() {
            local a b i
            IFS=. read -r -a a <<<"${1%%-*}"
            IFS=. read -r -a b <<<"${2%%-*}"
            for i in 0 1 2; do
              if (( 10#${a[$i]} < 10#${b[$i]} )); then echo -1; return; fi
              if (( 10#${a[$i]} > 10#${b[$i]} )); then echo 1; return; fi
            done
            echo 0
          }
          channel_rank() { case "$1" in alpha) echo 1 ;; beta) echo 2 ;; rc) echo 3 ;; *) echo 0 ;; esac; }
          if [[ -n "$TARGETS" ]]; then
            {
              echo ""
              echo "### target versioning"
            } >> "$GITHUB_STEP_SUMMARY"
            TARGET_LIST=$(echo "$TARGETS" | paste -sd ' ' -)
            TARGETS_JSON=$(echo "$TARGETS" | jq -R . | jq -sc .)
            # Records against the manifest: on a prerelease branch, or when the
            # branch is unknown.
            PRE_BRANCHES=$(jq -r '([(.plugins // [])[] | objects | select(.type == "target-context")][0] // {})
              | (.prereleaseBranches // ["next"]) | if type == "array" then .[] | strings else empty end' "$CONFIG_PATH" 2>/dev/null)
            RECORDS_LIVE=1
            if [[ -n "${BRANCH:-}" ]] && ! grep -Fxq -- "$BRANCH" <<<"$PRE_BRANCHES"; then
              RECORDS_LIVE=0
              if jq -e '[(.packages // {})[] | select(has("x-channel") or has("x-open-line"))] | length > 0' "$CONFIG_PATH" >/dev/null 2>&1; then
                info "branch $BRANCH is not a prerelease branch ($(echo "$PRE_BRANCHES" | paste -sd ' ' -)): x-channel / x-open-line records are inert here and not checked against the manifest"
              fi
            fi
            PLUGIN_TYPES='[(.plugins // [])[] | if type == "string" then . else (.type // "") end]'
            CTX_AT=$(jq -r "$PLUGIN_TYPES | index(\"target-context\") // -1" "$CONFIG_PATH")
            GROUP_AT=$(jq -r "$PLUGIN_TYPES | index(\"conditional-linked-versions\") // -1" "$CONFIG_PATH")
            if [[ "$CTX_AT" == "-1" ]]; then
              fail "packages $TARGET_LIST use versioning target but plugins has no target-context"
              fixhint "add {\"type\": \"target-context\"} to plugins in $CONFIG_PATH, before any conditional-linked-versions"
            elif [[ "$GROUP_AT" != "-1" && "$GROUP_AT" -lt "$CTX_AT" ]]; then
              fail "plugins lists conditional-linked-versions before target-context"
              fixhint "move {\"type\": \"target-context\"} ahead of every conditional-linked-versions in $CONFIG_PATH"
            else
              ok "plugins: target-context present, ahead of any conditional-linked-versions"
            fi

            # target-context options, then the groups
            PROBLEMS=$(jq -r --argjson targets "$TARGETS_JSON" '
              ([(.plugins // [])[] | objects | select(.type == "target-context")][0] // {}) as $ctx
              | ((.packages // {}) | to_entries | map(select(.value.component != null) | {key: .value.component, value: .key}) | from_entries) as $pathOf
              | [(.plugins // [])[] | objects | select(.type == "conditional-linked-versions")] as $groups
              | ( ($ctx | ("stableBranches", "prereleaseBranches") as $k
                    | select(has($k)) | select((.[$k] | type) != "array" or any(.[$k][]; type != "string"))
                    | "target-context \($k) must be an array of branch names"),
                  ($ctx | select(has("maintenanceBranchPattern")) | select((.maintenanceBranchPattern | type) != "string")
                    | "target-context maintenanceBranchPattern must be a string (a regular expression)"),
                  ($ctx | (.stableBranches // ["main"]) as $s | (.prereleaseBranches // ["next"]) as $p
                    | select(($s | type) == "array" and ($p | type) == "array")
                    | ($s - ($s - $p))[] | "target-context: branch \(.) is in both stableBranches and prereleaseBranches"),
                  ($groups[]
                    | if (.groupName | type) != "string" or .groupName == "" then "a conditional-linked-versions entry has no groupName"
                      elif (.components | type) != "array" or (.components | length) == 0 then "group \(.groupName): components must be a non-empty array"
                      else .groupName as $g | .components[] | . as $c | $pathOf[$c] as $path
                        | if $path == null then "group \($g): component \($c) is not a configured component"
                          elif ($targets | index($path)) == null then "group \($g): component \($c) (\($path)) does not use versioning target"
                          else empty end
                      end),
                  ([$groups[] | select((.components | type) == "array") | .components[]] | group_by(.)[] | select(length > 1)
                    | "component \(.[0]) is in more than one conditional-linked-versions group"),
                  ([(.plugins // [])[] | objects | select(.type == "linked-versions") | (.components // [])[]] | unique[]
                    | . as $c | $pathOf[$c] as $path | select($path != null and ($targets | index($path)) != null)
                    | "component \($c) uses versioning target but sits in a linked-versions group")
                )' "$CONFIG_PATH" 2>&1)
            if [[ -n "$PROBLEMS" ]]; then
              while IFS= read -r problem; do
                fail "$problem"
              done <<<"$PROBLEMS"
              fixhint "see references/how-to/target-versioning.md#config for the plugin shapes"
            else
              GROUPS_N=$(jq -r '[(.plugins // [])[] | objects | select(.type == "conditional-linked-versions")] | length' "$CONFIG_PATH")
              ok "target-context options and $GROUPS_N conditional-linked-versions group(s) well-formed"
            fi

            for path in $TARGETS; do
              PT=$(jq -r --arg p "$path" '.packages[$p]["prerelease-type"] // .["prerelease-type"] // empty' "$CONFIG_PATH")
              RA=$(jq -r --arg p "$path" '.packages[$p]["release-as"] // .["release-as"] // empty' "$CONFIG_PATH")
              # A package's own value, else (unset or null: release-please's `??`) the top level's.
              BMPM=$(jq -r --arg p "$path" 'if .packages[$p]["bump-minor-pre-major"] != null then .packages[$p]["bump-minor-pre-major"] else .["bump-minor-pre-major"] end | tostring' "$CONFIG_PATH")
              BPMPM=$(jq -r --arg p "$path" 'if .packages[$p]["bump-patch-for-minor-pre-major"] != null then .packages[$p]["bump-patch-for-minor-pre-major"] else .["bump-patch-for-minor-pre-major"] end | tostring' "$CONFIG_PATH")
              SEED=$(jq -r --arg p "$path" '.[$p] // empty' "$MANIFEST_PATH" 2>/dev/null)
              BAD=0
              if [[ -n "$PT" && "$PT" != "alpha.0" ]]; then
                fail "package $path prerelease-type '$PT': every target line starts on alpha.0"
                fixhint "set prerelease-type: alpha.0; promote a line with x-channel (scripts/release-please-target/bin/promote.js channel beta --package $path)"
                BAD=1
              fi
              # x-channel: {"line": "x.y.z", "channel": "beta" | "rc"}, for the current line
              XC=$(jq -c --arg p "$path" '.packages[$p]["x-channel"] // empty' "$CONFIG_PATH")
              if [[ -n "$XC" ]]; then
                XL=$(jq -r 'if type == "object" and (.line | type) == "string" and (.line | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) then .line else empty end' <<<"$XC")
                XCH=$(jq -r 'if type == "object" and (.channel == "beta" or .channel == "rc") then .channel else empty end' <<<"$XC")
                if [[ -z "$XL" || -z "$XCH" ]]; then
                  fail "package $path x-channel $XC: expected {\"line\": \"x.y.z\", \"channel\": \"beta\" | \"rc\"}"
                  BAD=1
                elif [[ $RECORDS_LIVE -eq 0 ]]; then
                  :
                elif [[ "$SEED" != *-* ]]; then
                  fail "package $path x-channel is for line $XL, but the manifest has stable '${SEED:-none}': no open line to promote"
                  fixhint "remove x-channel (bin/promote.js clear channel --package $path); a new line starts on alpha"
                  BAD=1
                elif [[ "$(core_cmp "$XL" "$SEED")" != "0" ]]; then
                  fail "package $path x-channel is for line $XL, but its current target is ${SEED%%-*} (manifest $SEED)"
                  fixhint "a promotion expires with its line: remove it, or promote the current line (bin/promote.js)"
                  BAD=1
                else
                  CUR_CH=${SEED#*-}
                  CUR_CH=${CUR_CH%%.*}
                  RC=$(channel_rank "$CUR_CH")
                  RX=$(channel_rank "$XCH")
                  if (( RX < RC )); then
                    fail "package $path x-channel $XCH is behind its current $SEED: channels never move backwards"
                    BAD=1
                  elif (( RX > RC + 1 )); then
                    fail "package $path x-channel $XCH skips a channel from $SEED: channels move alpha -> beta -> rc"
                    BAD=1
                  fi
                fi
              fi
              # x-open-line: "x.y.z", above the current target
              XO=$(jq -c --arg p "$path" '.packages[$p]["x-open-line"] // empty' "$CONFIG_PATH")
              if [[ -n "$XO" ]]; then
                XOL=$(jq -r 'if type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$") then . else empty end' <<<"$XO")
                if [[ -z "$XOL" ]]; then
                  fail "package $path x-open-line $XO: expected \"x.y.z\""
                  BAD=1
                elif [[ $RECORDS_LIVE -eq 1 && -n "$SEED" && "$(core_cmp "$SEED" "$XOL")" != "-1" ]]; then
                  fail "package $path x-open-line $XOL is already reached (manifest $SEED)"
                  fixhint "remove x-open-line (bin/promote.js clear open-line --package $path)"
                  BAD=1
                fi
              fi
              if [[ -n "$RA" ]]; then
                fail "package $path sets release-as '$RA' — target versioning picks the version"
                fixhint "remove release-as from $CONFIG_PATH (references/how-to/target-versioning.md#migrate)"
                BAD=1
              fi
              if [[ "$BMPM" == "false" || "$BPMPM" == "true" ]]; then
                fail "package $path: bump-minor-pre-major false / bump-patch-for-minor-pre-major true contradict target versioning (pre-1.0 breaking or feat -> minor)"
                fixhint "set bump-minor-pre-major: true and drop bump-patch-for-minor-pre-major"
                BAD=1
              fi
              if [[ $BAD -eq 0 ]]; then
                ok "package $path: versioning target${XCH:+, $XCH promotion for $XL}${XOL:+, opens $XOL}"
              fi
              XCH=""; XL=""; XOL=""
            done

            if [[ -f "$RP_PATH" ]]; then
              if grep -Eq "uses:[[:space:]]*hop-top/\.github/\.github/workflows/release-please-on-push\.yml@" "$RP_PATH" \
                && grep -Eq "^[[:space:]]*versioning-extension:[[:space:]]*true([[:space:]]|$)" "$RP_PATH"; then
                ok "release-please.yml runs release-please-on-push with versioning-extension: true"
              else
                fail "packages $TARGET_LIST use versioning target, but release-please.yml does not run release-please-on-push with versioning-extension: true (release-please-action has no target versioning)"
                fixhint "call hop-top/.github/.github/workflows/release-please-on-push.yml@v0 with 'versioning-extension: true'"
              fi
            fi
          fi

          # ---------- Check 5: manifest seed shape vs prerelease config ----------
          if [[ -f "$MANIFEST_PATH" && -f "$CONFIG_PATH" && -n "${PACKAGES:-}" ]]; then
            {
              echo ""
              echo "### manifest seed"
            } >> "$GITHUB_STEP_SUMMARY"
            if ! jq empty "$MANIFEST_PATH" 2>/dev/null; then
              fail "$MANIFEST_PATH is not valid JSON"
            else
              for path in $PACKAGES; do
                PRERELEASE=$(jq -r --arg p "$path" '.packages[$p].prerelease // false' "$CONFIG_PATH")
                SEED=$(jq -r --arg p "$path" '.[$p] // empty' "$MANIFEST_PATH")
                if [[ -z "$SEED" ]]; then
                  warn "no manifest seed for package $path"
                  fixhint "add \"$path\": \"<version>\" to $MANIFEST_PATH"
                  continue
                fi
                VERSIONING=$(jq -r --arg p "$path" '.packages[$p].versioning // .versioning // empty' "$CONFIG_PATH")
                if [[ "$VERSIONING" == "target" ]]; then
                  ok "package $path: manifest seed '$SEED' (versioning target: the branch decides stable or prerelease)"
                elif [[ "$PRERELEASE" == "true" ]]; then
                  if [[ "$SEED" == *-* ]]; then
                    ok "package $path: manifest seed '$SEED' is prerelease-shaped"
                  else
                    fail "package $path declares prerelease but manifest seed '$SEED' is stable"
                    fixhint "change seed to e.g. '${SEED}-alpha.1' in $MANIFEST_PATH"
                  fi
                else
                  if [[ "$SEED" == *-* ]]; then
                    warn "package $path is stable but manifest seed '$SEED' has prerelease suffix"
                    fixhint "drop the suffix in $MANIFEST_PATH or set prerelease: true in $CONFIG_PATH"
                  else
                    ok "package $path: manifest seed '$SEED' is stable-shaped"
                  fi
                fi
              done
            fi
          fi

          # ---------- Check 5b: PEP 440 / SemVer intersection (Python) ----------
          # release-please's release-type: python normalizes SemVer -> PEP 440
          # when writing Python source files (pyproject.toml, setup.py, etc.).
          # A manual `extra-files` block with `type: toml` and `path: pyproject.toml`
          # BYPASSES that normalization — it writes the raw SemVer string
          # (`0.1.0-alpha.1`) into pyproject.toml, which is invalid PEP 440
          # and breaks pip install / twine check.
          if [[ -f "$CONFIG_PATH" && -n "${PACKAGES:-}" ]]; then
            {
              echo ""
              echo "### PEP 440 / SemVer intersection (Python packages)"
            } >> "$GITHUB_STEP_SUMMARY"
            for path in $PACKAGES; do
              RT=$(jq -r --arg p "$path" '.packages[$p]["release-type"] // .["release-type"] // empty' "$CONFIG_PATH")
              if [[ "$RT" != "python" ]]; then
                continue
              fi
              # The package's own pyproject.toml, however the entry spells it
              # (`pyproject.toml`, or root-relative `/<package>/pyproject.toml`).
              if [[ "$path" == "." ]]; then
                NATIVE_PYPROJECT="pyproject.toml"
              else
                NATIVE_PYPROJECT="${path%/}/pyproject.toml"
              fi
              HAS_PYPROJECT_EXTRA=$(extra_files "$path" | cut -f2 | grep -cxF "$NATIVE_PYPROJECT" || true)
              if [[ "${HAS_PYPROJECT_EXTRA:-0}" -gt 0 ]]; then
                fail "package $path (release-type python) has an extra-files block targeting pyproject.toml — bypasses PEP 440 normalization, writes SemVer (0.1.0-alpha.1) instead of PEP 440 (0.1.0a1)"
                fixhint "remove the pyproject.toml entry from extra-files in $CONFIG_PATH — release-type python updates it natively with PEP 440 normalization"
              else
                ok "package $path: no extra-files override for pyproject.toml (release-type python will normalize PEP 440 natively)"
              fi
              # Validate pyproject.toml current value via tomllib (handles spacing,
              # single/double quotes, sub-tables — grep is too fragile).
              if [[ -f pyproject.toml ]]; then
                PYP_VERSION=$(python3 - <<'PY' 2>/dev/null || true
          import sys
          try:
              import tomllib  # 3.11+
          except ImportError:
              import tomli as tomllib  # 3.10 fallback
          try:
              with open("pyproject.toml", "rb") as f:
                  doc = tomllib.load(f)
              v = (doc.get("project") or {}).get("version") or (doc.get("tool", {}).get("poetry", {}) or {}).get("version") or ""
              print(v)
          except Exception:
              sys.exit(1)
          PY
                )
                if [[ -n "$PYP_VERSION" ]]; then
                  # PEP 440 prerelease: N.N.NaN / bN / rcN / .devN / .postN
                  # Anti-pattern: N.N.N-alphaN with hyphen
                  if [[ "$PYP_VERSION" == *-* ]]; then
                    fail "pyproject.toml version '$PYP_VERSION' is SemVer-shaped, not PEP 440 — pip / twine will reject"
                    fixhint "rewrite to PEP 440 (e.g. ${PYP_VERSION%%-*}$(echo "${PYP_VERSION#*-}" | sed -E 's/alpha\.?/a/; s/beta\.?/b/; s/rc\.?/rc/' | tr -d '.')) and let release-please own it from here on"
                  else
                    ok "pyproject.toml version '$PYP_VERSION' looks PEP 440-compatible"
                  fi
                else
                  info "could not extract pyproject.toml version (no [project].version or [tool.poetry].version)"
                fi
              fi
            done
          fi

          # ---------- Check 5c: spec packages ----------
          # A package whose path is `<root>/vX.Y` is a spec version directory
          # (the shared spec-commit-rules / spec-status-line / version-check
          # workflows derive the spec roots from exactly this shape). The
          # directory must exist, the manifest must know the package (the
          # version-check spec-path rule reads `<root>/vX.Y` manifest keys —
          # a missing key is a hard failure here, where check 5 only warns
          # for an ordinary package), and the strategy should be `simple`.
          if [[ -f "$CONFIG_PATH" && -n "${PACKAGES:-}" ]]; then
            {
              echo ""
              echo "### spec packages"
            } >> "$GITHUB_STEP_SUMMARY"
            MANIFEST_OK=false
            if [[ -f "$MANIFEST_PATH" ]] && jq empty "$MANIFEST_PATH" 2>/dev/null; then
              MANIFEST_OK=true
            fi
            SPEC_SEEN=0
            for path in $PACKAGES; do
              if [[ ! "$path" =~ ^[A-Za-z0-9_.-]+/v[0-9]+\.[0-9]+$ ]]; then
                continue
              fi
              SPEC_SEEN=$((SPEC_SEEN+1))
              if [[ -d "$path" ]]; then
                ok "spec package $path: directory exists"
              else
                fail "spec package $path: no such directory in the checkout"
                fixhint "create $path/ (the released major.minor line) or drop the package from $CONFIG_PATH"
              fi
              if [[ "$MANIFEST_OK" == "true" ]]; then
                SEED=$(jq -r --arg p "$path" '.[$p] // empty' "$MANIFEST_PATH")
                if [[ -n "$SEED" ]]; then
                  ok "spec package $path: manifest key present ($SEED)"
                else
                  fail "spec package $path has no manifest key — the version-check spec-path rule cannot know its version"
                  fixhint "add \"$path\": \"<version>\" to $MANIFEST_PATH (prerelease-shaped when the package is prerelease, e.g. 0.1.0-alpha.0)"
                fi
              fi
              RT=$(jq -r --arg p "$path" '.packages[$p]["release-type"] // .["release-type"] // empty' "$CONFIG_PATH")
              if [[ "$RT" == "simple" ]]; then
                ok "spec package $path: release-type simple"
              else
                warn "spec package $path has release-type '${RT:-unset}' — a spec directory has no native version file; expected 'simple'"
                fixhint "set .packages.\"$path\".\"release-type\" to \"simple\" in $CONFIG_PATH"
              fi
            done
            if [[ $SPEC_SEEN -eq 0 ]]; then
              info "no spec package (<root>/vX.Y) in $CONFIG_PATH"
            fi
          fi

          # ---------- Check 5d: extra-files targets ----------
          # Every `extra-files` entry (a string, or an object with `path`),
          # resolved the way release-please resolves it (see extra_files:
          # a leading `/` is repo-root-relative, anything else joins the
          # package path), must name a file in the checkout.
          # A configured file that does not exist is a config-shape defect.
          # Then each entry is checked by the rule of the updater
          # release-please picks for it (Strategy#extraFileUpdates):
          #   - `type` json / yaml / toml: its `jsonpath` must reach the value
          #     (json: a version string; yaml, toml: a string). No jsonpath, a
          #     json file that does not parse, or a toml value that is not a
          #     string, fails release-please's run; a path matching nothing
          #     is skipped by it (a warning here).
          #   - `type` xml (needs `xpath`) / pom: existence only.
          #   - an empty `jsonpath` updates nothing (release-please stays
          #     silent): a failure here; an empty `xpath` throws like a
          #     missing one.
          #   - a string entry ending in .json / .yaml / .yml / .toml / .xml:
          #     release-please rewrites `$.version` (`/*/version`), then any
          #     annotation; a .json one that does not parse, or a .toml one
          #     whose `$.version` is not a string, fails its run.
          #   - `type` generic, and any other string entry: the
          #     x-release-please-<scope> annotation the generic updater
          #     rewrites (the pyproject.toml case belongs to check 5b).
          #   - any other `type` (or none; an object of type "string" too):
          #     release-please throws.
          # A glob entry is matched on the target branch by release-please;
          # its matches are not checked here. One with no selector throws
          # only once the glob matches a file (a warning here). The
          # literal's value stays with the version-check guard.
          if [[ -f "$CONFIG_PATH" && -n "${PACKAGES:-}" ]]; then
            {
              echo ""
              echo "### extra-files targets"
            } >> "$GITHUB_STEP_SUMMARY"
            EXTRA_SEEN=0
            for path in $PACKAGES; do
              ENTRIES=$(extra_files "$path")
              [[ -n "$ENTRIES" ]] || continue
              while IFS=$'\t' read -r rel target kind sel glob; do
                [[ -n "$rel" && -n "$target" ]] || continue
                EXTRA_SEEN=$((EXTRA_SEEN+1))
                case "$kind" in
                  string|generic|json|yaml|toml|xml|pom) ;;
                  *)
                    if [[ "$kind" == "(none)" ]]; then
                      fail "package $path extra-files entry '$rel' has no type — release-please supports generic, json, yaml, toml, xml, pom"
                    else
                      fail "package $path extra-files entry '$rel' has type '${kind#\?}' — release-please supports generic, json, yaml, toml, xml, pom"
                    fi
                    fixhint "set \"type\" on the entry in $CONFIG_PATH (generic for an x-release-please-version annotation)"
                    continue
                    ;;
                esac
                case "$sel" in
                  -) SEL_STATE="unset"; sel="" ;;
                  =) SEL_STATE="empty"; sel="" ;;
                  *) SEL_STATE="set"; sel="${sel#=}" ;;
                esac
                SELECTOR_KEY=""
                case "$kind" in
                  json|yaml|toml) SELECTOR_KEY=jsonpath ;;
                  xml) SELECTOR_KEY=xpath ;;
                esac
                if [[ -n "$SELECTOR_KEY" && ( "$SEL_STATE" == unset || ( "$SEL_STATE" == empty && "$kind" == xml ) ) ]]; then
                  if [[ "$glob" == "true" ]]; then
                    warn "package $path extra-files glob entry '$rel' (type $kind) has no $SELECTOR_KEY — release-please fails on it once the glob matches a file"
                  else
                    fail "package $path extra-files entry '$rel' (type $kind) has no $SELECTOR_KEY — release-please fails on it"
                  fi
                  fixhint "add \"$SELECTOR_KEY\" naming the version field to the entry in $CONFIG_PATH"
                  continue
                fi
                if [[ -n "$SELECTOR_KEY" && "$SEL_STATE" == empty ]]; then
                  fail "package $path extra-files entry '$rel' (type $kind) has an empty $SELECTOR_KEY — release-please updates nothing in it"
                  fixhint "set \"$SELECTOR_KEY\" to the version field of the entry in $CONFIG_PATH"
                  continue
                fi
                if [[ "$glob" == "true" ]]; then
                  info "package $path: extra-files entry '$rel' is a glob — its matches are not checked by the preflight"
                  continue
                fi
                if [[ ! -f "$target" ]]; then
                  fail "package $path lists extra-files entry '$rel' but $target does not exist"
                  fixhint "create $target with an x-release-please-version annotation, or remove the entry from $CONFIG_PATH"
                  continue
                fi
                ok "package $path: extra-files entry '$rel' exists ($target)"

                # Typed updater: the probe decides.
                PROBE_KIND=""
                PROBE_SEL="$sel"
                PSTATE=""
                PVALUE=""
                case "$kind" in
                  json|yaml|toml) PROBE_KIND="$kind" ;;
                  xml|pom) continue ;;
                  string)
                    case "$rel" in
                      *.json) PROBE_KIND=json; PROBE_SEL='$.version' ;;
                      *.yaml|*.yml) PROBE_KIND=yaml; PROBE_SEL='$.version' ;;
                      *.toml) PROBE_KIND=toml; PROBE_SEL='$.version' ;;
                      *.xml) PROBE_KIND=xml-root; PROBE_SEL='/*/version' ;;
                    esac
                    ;;
                esac
                if [[ -n "$PROBE_KIND" ]]; then
                  IFS=$'\t' read -r PSTATE PVALUE <<<"$(extra_file_probe "$PROBE_KIND" "$target" "$PROBE_SEL")"
                  if [[ "$PSTATE" == "ok" ]]; then
                    ok "extra-files target $target: $PROBE_SEL = $PVALUE"
                    continue
                  fi
                  if [[ "$PSTATE" == "parse" && "$PROBE_KIND" == "json" ]]; then
                    fail "extra-files target $target is not valid JSON ($PVALUE) — release-please fails parsing it"
                    fixhint "make $target plain JSON, or use {\"type\": \"generic\"} with an x-release-please-version annotation for a template"
                    continue
                  fi
                  # GenericToml replaces a string (or a boolean) in place and
                  # throws on anything else: a number, table, array or date.
                  if [[ "$PSTATE" == "notversion" && "$PROBE_KIND" == "toml" ]]; then
                    if [[ "$PVALUE" == true || "$PVALUE" == false ]]; then
                      fail "extra-files target $target: $PROBE_SEL is $PVALUE, not a string — release-please overwrites it with the version"
                    else
                      fail "extra-files target $target: $PROBE_SEL is $PVALUE, not a string — release-please's TOML updater fails on it"
                    fi
                    if [[ "$kind" == "string" ]]; then
                      fixhint "make $PROBE_SEL in $target the version string, or use {\"type\": \"generic\"} with an x-release-please-version annotation"
                    else
                      fixhint "point the entry's jsonpath at the version string in $target in $CONFIG_PATH"
                    fi
                    continue
                  fi
                  if [[ "$kind" != "string" ]]; then
                    case "$PSTATE" in
                      missing)
                        warn "extra-files target $target: jsonpath $sel matches nothing — release-please rewrites nothing in it"
                        fixhint "point the entry's jsonpath at the version field of $target in $CONFIG_PATH"
                        ;;
                      notversion)
                        warn "extra-files target $target: jsonpath $sel is $PVALUE, not a version string — release-please rewrites nothing in it"
                        fixhint "point the entry's jsonpath at the version string in $target in $CONFIG_PATH"
                        ;;
                      parse)
                        warn "extra-files target $target is not valid $kind ($PVALUE) — release-please rewrites nothing in it"
                        ;;
                      *)
                        info "extra-files target $target: jsonpath $sel not evaluated by the preflight (${PVALUE:-no result})"
                        ;;
                    esac
                    continue
                  fi
                  # A string entry falls through to its annotations.
                fi

                if [[ "$(basename "$rel")" == "pyproject.toml" ]]; then
                  continue  # check 5b owns this case
                fi
                if ! has_annotation "$target"; then
                  if [[ "$PSTATE" == "skip" ]]; then
                    info "extra-files target $target: $PROBE_SEL not evaluated by the preflight ($PVALUE), and no x-release-please-version annotation"
                    continue
                  elif [[ -n "$PROBE_KIND" ]]; then
                    warn "extra-files target $target carries no x-release-please-version annotation and no version at $PROBE_SEL — release-please rewrites nothing in it"
                  else
                    warn "extra-files target $target carries no x-release-please-version annotation — release-please rewrites nothing in it"
                  fi
                  fixhint "annotate the version literal's line in $target with x-release-please-version (see references/how-to/spec-versioning.md); the version-check guard fails this as 'configured'"
                fi
              done <<<"$ENTRIES"
            done
            if [[ $EXTRA_SEEN -eq 0 ]]; then
              info "no extra-files entries in $CONFIG_PATH"
            fi
          fi

          # ---------- Check 5e: stale release-as ----------
          # `release-as` (a package's own, else -- unset or null, release-please's
          # `??` -- the top-level default) makes
          # release-please propose exactly that version on every run. Once
          # that release is cut the pin is stale: release-please proposes the
          # same version again, or a lower one. Stale = below the package's
          # manifest version (SemVer precedence), or its tag exists in the
          # checkout (`<component><tag-separator>v<version>`, honouring
          # include-component-in-tag / include-v-in-tag; not checked for a
          # package without `component`). A pin equal to the manifest seed
          # with no tag yet is a first-release pin (seed 0.1.0-alpha.0 pinned
          # so the first tag is alpha.0), stale only once that tag exists.
          # versioning target refuses release-as outright (check 4b).
          SEMVER_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          # semver_cmp A B: -1 / 0 / 1 by SemVer precedence (build ignored)
          semver_cmp() {
            local va="${1%%+*}" vb="${2%%+*}" c ap="" bp="" i n x y
            local -a pa pb
            c=$(core_cmp "$va" "$vb")
            if [[ "$c" != "0" ]]; then echo "$c"; return; fi
            [[ "$va" == *-* ]] && ap="${va#*-}"
            [[ "$vb" == *-* ]] && bp="${vb#*-}"
            if [[ -z "$ap" && -z "$bp" ]]; then echo 0; return; fi
            if [[ -z "$ap" ]]; then echo 1; return; fi
            if [[ -z "$bp" ]]; then echo -1; return; fi
            IFS=. read -r -a pa <<<"$ap"
            IFS=. read -r -a pb <<<"$bp"
            n=${#pa[@]}
            (( ${#pb[@]} > n )) && n=${#pb[@]}
            for (( i = 0; i < n; i++ )); do
              x="${pa[$i]-}"
              y="${pb[$i]-}"
              if [[ -z "$x" ]]; then echo -1; return; fi
              if [[ -z "$y" ]]; then echo 1; return; fi
              if [[ "$x" =~ ^[0-9]+$ && "$y" =~ ^[0-9]+$ ]]; then
                if (( 10#$x < 10#$y )); then echo -1; return; fi
                if (( 10#$x > 10#$y )); then echo 1; return; fi
              elif [[ "$x" =~ ^[0-9]+$ ]]; then echo -1; return
              elif [[ "$y" =~ ^[0-9]+$ ]]; then echo 1; return
              elif [[ "$x" < "$y" ]]; then echo -1; return
              elif [[ "$x" > "$y" ]]; then echo 1; return
              fi
            done
            echo 0
          }
          # release_tag <package> <version>: the tag release-please cuts for it
          # (empty when the package has no component and the tag needs one)
          release_tag() {
            jq -r --arg p "$1" --arg v "$2" '
              def opt($k; $d): if .packages[$p][$k] != null then .packages[$p][$k] elif .[$k] != null then .[$k] else $d end;
              (.packages[$p].component // "") as $c
              | (if opt("include-v-in-tag"; true) == false then "" else "v" end) as $vp
              | if opt("include-component-in-tag"; true) == false then $vp + $v
                elif $c == "" then empty
                else $c + (opt("tag-separator"; "-") | tostring) + $vp + $v end
            ' "$CONFIG_PATH" 2>/dev/null
          }
          if [[ -f "$CONFIG_PATH" && -n "${PACKAGES:-}" ]]; then
            PINS=$(jq -r '.versioning as $top_versioning | (.["release-as"] // "") as $top
              | (.packages // {}) | to_entries[]
              | select((.value.versioning // $top_versioning) != "target")
              | (if .value["release-as"] != null then .value["release-as"] else $top end) as $ra
              | select(($ra | type) == "string" and $ra != "")
              | "\(.key)\t\($ra)"' "$CONFIG_PATH" 2>/dev/null)
            if [[ -n "$PINS" ]]; then
              {
                echo ""
                echo "### release-as pins"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            while IFS=$'\t' read -r path ra; do
              [[ -n "$path" && -n "$ra" ]] || continue
              SEED=$(jq -r --arg p "$path" '.[$p] // empty' "$MANIFEST_PATH" 2>/dev/null)
              REASONS=""
              CMP=""
              if [[ "$ra" =~ $SEMVER_RE && "$SEED" =~ $SEMVER_RE ]]; then
                CMP=$(semver_cmp "$ra" "$SEED")
              fi
              if [[ "$CMP" == "-1" ]]; then
                REASONS="below the manifest's $SEED"
              fi
              TAG=$(release_tag "$path" "$ra")
              if [[ -n "$TAG" ]] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
                REASONS="${REASONS:+$REASONS; }tag $TAG exists"
              fi
              if [[ -n "$REASONS" ]]; then
                warn "package $path release-as '$ra' is stale ($REASONS) — release-please keeps proposing $ra until the pin is removed"
                fixhint "remove release-as from package $path in $CONFIG_PATH once its release is cut"
              elif [[ "$CMP" == "0" && -z "$TAG" ]]; then
                info "package $path: release-as '$ra' equals the manifest's seed; its tag is not checked (no component)"
              elif [[ "$CMP" == "0" ]]; then
                ok "package $path: release-as '$ra' equals the manifest's seed and tag $TAG does not exist yet — the first release"
              else
                ok "package $path: release-as '$ra' is above the manifest's ${SEED:-(no seed)}"
              fi
            done <<<"$PINS"
          fi

          # ---------- Check 5f: nested modules vs exclude-paths ----------
          # release-please gives the root package `.` every commit, and any
          # other package the commits under its path that no deeper package
          # claims; `exclude-paths` (repo-root-relative; a package's own, else
          # -- unset or null -- the top-level default) is the only way out. A nested directory
          # that is a module of its own -- a go.mod, or (under the root) a
          # configured package with its own manifest -- and is not excluded
          # releases its parent on every commit made in it. A release-type
          # simple package (an aggregate moving with everything below it) is
          # not checked; node_modules, vendor and testdata are skipped.
          # Only tracked files count (`git ls-files`): release-please splits
          # commits, which never touch an untracked or ignored file. Outside
          # a git checkout the file tree stands in for them (an [INFO] line
          # says so).
          if [[ -f "$CONFIG_PATH" && -n "${PACKAGES:-}" ]]; then
            {
              echo ""
              echo "### nested modules"
            } >> "$GITHUB_STEP_SUMMARY"
            MODULE_FILES_RE='(^|/)(go\.mod|package\.json|Cargo\.toml|pyproject\.toml|composer\.json)$'
            if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              MODULE_FILES=$(git ls-files -z 2>/dev/null | tr '\0' '\n' | grep -E "$MODULE_FILES_RE")
            else
              info "not a git checkout — nested modules are looked up on disk, untracked files included"
              MODULE_FILES=$(find . -name .git -prune -o -type f -print 2>/dev/null | sed -e 's|^\./||' | grep -E "$MODULE_FILES_RE")
            fi
            MODULE_FILES=$(printf '%s\n' "$MODULE_FILES" | grep -Ev '(^|/)(node_modules|vendor|testdata)/')
            # has_module_file <path>: a tracked (or, outside git, existing) file
            has_module_file() { printf '%s\n' "$MODULE_FILES" | grep -qxF "$1"; }
            GOMOD_DIRS=$(printf '%s\n' "$MODULE_FILES" | grep -E '(^|/)go\.mod$' | sed -e 's|/go\.mod$||' | grep -vx 'go\.mod' | sort -u)
            NESTED_SEEN=0
            for path in $PACKAGES; do
              RT=$(jq -r --arg p "$path" '.packages[$p]["release-type"] // .["release-type"] // empty' "$CONFIG_PATH")
              [[ "$RT" == "simple" ]] && continue
              EXCLUDES=$(jq -r --arg p "$path" '
                (if .packages[$p]["exclude-paths"] != null then .packages[$p]["exclude-paths"] else (.["exclude-paths"] // []) end)
                | if type == "array" then .[] | strings | sub("^/+"; "") | sub("/+$"; "") else empty end' "$CONFIG_PATH" 2>/dev/null)
              CANDIDATES=""
              while IFS= read -r dir; do
                [[ -n "$dir" && "$dir" != "$path" ]] || continue
                if [[ "$path" != "." ]]; then
                  [[ "$dir" == "$path"/* ]] || continue
                  OWNER=""
                  for q in $PACKAGES; do
                    [[ "$q" != "." ]] || continue
                    if [[ "$dir" == "$q" || "$dir" == "$q"/* ]] && (( ${#q} > ${#OWNER} )); then
                      OWNER="$q"
                    fi
                  done
                  [[ "$OWNER" == "$path" ]] || continue
                fi
                CANDIDATES="$CANDIDATES$dir"$'\t'"go.mod"$'\n'
              done <<<"$GOMOD_DIRS"
              if [[ "$path" == "." ]]; then
                for q in $PACKAGES; do
                  if [[ "$q" == "." ]] || has_module_file "$q/go.mod"; then
                    continue
                  fi
                  for m in package.json Cargo.toml pyproject.toml composer.json; do
                    if has_module_file "$q/$m"; then
                      CANDIDATES="$CANDIDATES$q"$'\t'"$m"$'\n'
                      break
                    fi
                  done
                done
              fi
              while IFS=$'\t' read -r dir manifest; do
                [[ -n "$dir" ]] || continue
                EXCLUDED=0
                while IFS= read -r e; do
                  if [[ -n "$e" && ( "$dir" == "$e" || "$dir" == "$e"/* ) ]]; then
                    EXCLUDED=1
                    break
                  fi
                done <<<"$EXCLUDES"
                [[ $EXCLUDED -eq 0 ]] || continue
                NESTED_SEEN=$((NESTED_SEEN+1))
                warn "package $path: nested module $dir (own $manifest) is not in its exclude-paths — commits under $dir also release package $path"
                fixhint "add \"$dir\" to .packages.\"$path\".\"exclude-paths\" in $CONFIG_PATH"
              done <<<"$(printf '%s' "$CANDIDATES" | sort -u)"
            done
            if [[ $NESTED_SEEN -eq 0 ]]; then
              ok "no nested module releases its parent package"
            fi
          fi

          # ---------- Check 6: publish.yml triggers + ecosystems map ----------
          {
            echo ""
            echo "### publish workflow"
          } >> "$GITHUB_STEP_SUMMARY"
          ECO_KEYS=""
          if [[ "${SINGLE_LANG:-false}" == "true" ]]; then
            info "skipping publish.yml triggers + ecosystems checks (single-language adopter)"
            info "skipping three-way name alignment (single-language)"
          elif [[ -f "$PUBLISH_PATH" ]]; then
            # Tag filter — drill into pre-parsed publish.json
            TAGS=$(jq -r '.on.push.tags // [] | .[]' "$PUBLISH_JSON" 2>/dev/null || echo "")
            if echo "$TAGS" | grep -qE '^\*/v\*$'; then
              ok "publish.yml triggers on '*/v*' tags"
            elif [[ -z "$TAGS" ]]; then
              fail "publish.yml has no on.push.tags filter"
              fixhint "add 'on: push: tags: [\"*/v*\"]' in $PUBLISH_PATH"
            else
              warn "publish.yml tag filter is '$TAGS' — expected '*/v*'"
              fixhint "change to 'tags: [\"*/v*\"]' for the component/v<version> shape"
            fi

            USES=$(jq -r '.jobs.publish.uses // empty' "$PUBLISH_JSON" 2>/dev/null || echo "")
            if [[ "$USES" == hop-top/.github/.github/workflows/publish-on-tag.yml@* ]]; then
              ok "publish.yml delegates to hop-top/.github reusable workflow ($USES)"
            elif [[ -z "$USES" ]]; then
              warn "publish.yml does not call hop-top/.github reusable — hand-rolled publish?"
              fixhint "delegate via 'uses: hop-top/.github/.github/workflows/publish-on-tag.yml@v0'"
            else
              warn "publish.yml uses unexpected workflow ref: $USES"
            fi

            ECO_KEYS=$(jq -r '.jobs.publish.with.ecosystems // {} | keys[]' "$PUBLISH_JSON" 2>/dev/null || echo "")
            if [[ -z "$ECO_KEYS" ]]; then
              warn "publish.yml ecosystems map is empty or unparseable"
              fixhint "add an ecosystems entry per component (see SKILL.md)"
            else
              info "ecosystems keys: $(echo "$ECO_KEYS" | tr '\n' ' ')"
            fi

            # Three-way name alignment. The root '.' aggregate component is
            # sanctioned to be absent from ecosystems (it has nothing to
            # publish; publish-on-tag green-skips unknown components since
            # v0.11.1 — see common-pitfalls "Umbrella / meta-component tag").
            ROOT_COMPONENT=$(jq -r '.packages["."].component // empty' "$CONFIG_PATH")
            for component in $(jq -r '.packages // {} | to_entries[] | .value.component // empty' "$CONFIG_PATH"); do
              if echo "$ECO_KEYS" | grep -qx "$component"; then
                ok "three-way alignment: component '$component' matches ecosystems key"
              elif [ -n "$ROOT_COMPONENT" ] && [ "$component" = "$ROOT_COMPONENT" ]; then
                info "root aggregate component '$component' intentionally absent from ecosystems — publish-on-tag skips its tags"
              else
                fail "component '$component' has no matching ecosystems key in publish.yml"
                fixhint "add '$component:' entry to ecosystems in $PUBLISH_PATH"
              fi
            done
          fi

          # ---------- Check 7: release-please.yml uses release-bot App token ----------
          {
            echo ""
            echo "### release-please workflow"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$RP_PATH" ]]; then
            if grep -Eq "uses:[[:space:]]*hop-top/\.github/\.github/workflows/release-please-on-push\.yml@" "$RP_PATH"; then
              ok "release-please.yml calls the release-please-on-push reusable workflow (release-bot App token, concurrency guard)"
            elif grep -q "actions/create-github-app-token" "$RP_PATH"; then
              ok "release-please.yml mints App token via create-github-app-token"
            elif grep -q "GH_RELEASE_PLEASE_PAT" "$RP_PATH"; then
              fail "release-please.yml uses deprecated GH_RELEASE_PLEASE_PAT — PAT delivery is unreliable"
              fixhint "switch to release-bot App token (RELEASE_BOT_APP_ID + RELEASE_BOT_PRIVATE_KEY)"
            else
              warn "release-please.yml may be using GITHUB_TOKEN — PRs won't trigger downstream workflows"
              fixhint "call hop-top/.github/.github/workflows/release-please-on-push.yml@v0, or mint a release-bot App token (RELEASE_BOT_APP_ID/RELEASE_BOT_PRIVATE_KEY) via actions/create-github-app-token"
            fi

            if grep -q "workflow_dispatch" "$RP_PATH"; then
              ok "release-please.yml declares workflow_dispatch (manual retrigger enabled)"
            else
              warn "release-please.yml does not declare workflow_dispatch"
              fixhint "add 'workflow_dispatch: {}' under 'on:' so retriggering works after sibling-PR conflicts"
            fi
          fi

          # ---------- Check 8: per-ecosystem infrastructure ----------
          {
            echo ""
            echo "### per-ecosystem infrastructure"
          } >> "$GITHUB_STEP_SUMMARY"
          for component in $ECO_KEYS; do
            ECOSYSTEM=$(jq -r --arg c "$component" '.jobs.publish.with.ecosystems[$c].ecosystem // empty' "$PUBLISH_JSON" 2>/dev/null || echo "")
            PACKAGE=$(jq -r --arg c "$component" '.jobs.publish.with.ecosystems[$c].package // empty' "$PUBLISH_JSON" 2>/dev/null || echo "")
            MIRROR=$(jq -r --arg c "$component" '.jobs.publish.with.ecosystems[$c].mirror // empty' "$PUBLISH_JSON" 2>/dev/null || echo "")

            case "$ECOSYSTEM" in
              py)
                PYPI_AUTH=$(jq -r --arg c "$component" '.jobs.publish.with.ecosystems[$c]["pypi-auth"] // "oidc"' "$PUBLISH_JSON" 2>/dev/null || echo "oidc")
                PYPI_ENV=$(jq -r --arg c "$component" '.jobs.publish.with.ecosystems[$c]["pypi-environment"] // "pypi"' "$PUBLISH_JSON" 2>/dev/null || echo "pypi")
                if [[ "$PYPI_AUTH" == "oidc" ]]; then
                  # Capture HTTP status explicitly — distinguish 404 (missing) from
                  # 403 (token can't read) / 5xx (transient) so we don't false-fail.
                  HTTP=$(gh api "repos/$REPO/environments/$PYPI_ENV" --include 2>/dev/null | head -1 | awk '{print $2}' || true)
                  if [[ "$HTTP" == "200" ]]; then
                    ok "GitHub Environment '$PYPI_ENV' exists on $REPO"
                  elif [[ "$HTTP" == "404" ]]; then
                    fail "GitHub Environment '$PYPI_ENV' does not exist on $REPO (required for OIDC)"
                    fixhint "gh api -X PUT repos/$REPO/environments/$PYPI_ENV"
                  elif [[ "$HTTP" == "403" || "$HTTP" == "401" ]]; then
                    warn "could not verify GitHub Environment '$PYPI_ENV' on $REPO (HTTP $HTTP — token lacks permission)"
                    fixhint "verify the GITHUB_TOKEN has 'environments: read' or run with a token that does; or check manually via the repo Settings"
                  else
                    warn "GitHub Environment '$PYPI_ENV' check returned HTTP ${HTTP:-unknown}"
                    fixhint "re-run the preflight; if it persists, check via 'gh api repos/$REPO/environments/$PYPI_ENV'"
                  fi
                  info "PyPI trusted publisher must be configured at https://pypi.org/manage/account/publishing/ (workflow filename: $(basename "$PUBLISH_PATH"), environment: $PYPI_ENV)"
                else
                  info "PyPI auth: token mode — ensure PYPI_REGISTRY_TOKEN secret is set"
                fi
                if [[ -n "$PACKAGE" ]]; then
                  HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/$PACKAGE/json")
                  if [[ "$HTTP" == "200" ]]; then
                    info "PyPI package '$PACKAGE' exists — account must already own it for publish to succeed"
                  elif [[ "$HTTP" == "404" ]]; then
                    info "PyPI package '$PACKAGE' is unclaimed — first publish will claim the name"
                  else
                    warn "PyPI package '$PACKAGE' check returned HTTP $HTTP"
                  fi
                fi
                ;;
              ts)
                info "npm publish requires NPM_REGISTRY_TOKEN secret"
                if [[ -n "$PACKAGE" ]]; then
                  ENCODED=$(printf '%s' "$PACKAGE" | sed 's|/|%2F|g')
                  HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/$ENCODED")
                  if [[ "$HTTP" == "200" ]]; then
                    info "npm package '$PACKAGE' exists — account must already own it"
                  elif [[ "$HTTP" == "404" ]]; then
                    info "npm package '$PACKAGE' is unclaimed — first publish will claim it"
                  fi
                fi
                ;;
              rs)
                info "crates.io publish requires CARGO_REGISTRY_TOKEN secret AND a verified email on the account"
                ;;
              php)
                info "Packagist auto-syncs after first manual submit at https://packagist.org/packages/submit"
                ;;
              go)
                info "Go module proxy auto-pulls from tags; no token needed"
                ;;
              "")
                warn "ecosystem '$component' has no .ecosystem field — publish job will skip"
                ;;
              *)
                warn "unknown ecosystem '$ECOSYSTEM' for component '$component'"
                ;;
            esac

            # Mirror checks — same HTTP-status discipline as the env check above
            if [[ -n "$MIRROR" ]]; then
              info "mirror '$MIRROR' configured — GH_MIRROR_PAT secret required"
              HTTP=$(gh api "repos/$MIRROR" --include 2>/dev/null | head -1 | awk '{print $2}' || true)
              if [[ "$HTTP" == "200" ]]; then
                ok "mirror repo $MIRROR exists"
              elif [[ "$HTTP" == "404" ]]; then
                warn "mirror repo $MIRROR does not exist"
                fixhint "create $MIRROR before first publish, or remove mirror: field for single-language repos"
              elif [[ "$HTTP" == "403" || "$HTTP" == "401" ]]; then
                warn "could not verify mirror repo $MIRROR (HTTP $HTTP — token lacks permission)"
              else
                warn "mirror repo $MIRROR check returned HTTP ${HTTP:-unknown}"
              fi
            else
              info "no mirror configured for '$component' (single-language pattern)"
            fi
          done

          # ---------- Summary ----------
          {
            echo ""
            echo "### Summary"
            echo "- Breaking issues: $BREAKING"
            echo "- Warnings: $WARNING"
          } >> "$GITHUB_STEP_SUMMARY"

          apply_fail_on
