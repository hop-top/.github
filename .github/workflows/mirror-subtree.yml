name: mirror-subtree (reusable)

on:
  workflow_call:
    inputs:
      source-prefix:
        description: Subdirectory in the consuming repo to split (e.g. "ts", "rs")
        type: string
        required: true
      target-repo:
        description: Full slug of the read-only mirror (e.g. "hop-top/uri-ts")
        type: string
        required: true
      target-prefix:
        description: |
          Path on the MIRROR to publish under (e.g. "specs/v0.1"). Empty
          (the default) publishes at the mirror root — today's behaviour.

          Set this when the mirror's convention nests the payload, as the
          `spec-*` repos do (`specs/v<MAJOR>.<MINOR>/<files>`). A plain
          subtree split promotes `source-prefix` to the mirror root, which
          would scatter those files across the top level.

          Repo-relative, no `.`/`..` components; surrounding whitespace,
          duplicate slashes and trailing slashes are normalised away.
        type: string
        default: ""
      tag:
        description: Tag to create on the mirror (strip the component prefix)
        type: string
        required: true
      homepage:
        description: Homepage URL for the mirror repo
        type: string
        default: ""
      description:
        description: Description for the mirror repo
        type: string
        default: ""
      create-release:
        description: Create a GitHub Release on the mirror after push
        type: boolean
        default: true
      changelog-path:
        description: Path (within source-prefix) to the CHANGELOG for release body
        type: string
        default: CHANGELOG.md
      allow-target-redirect:
        description: |
          Push even when `target-repo` is a rename / transfer redirect to
          another repository. Off by default: the job resolves the real
          name (`gh api repos/<target-repo>`, which follows redirects) and
          refuses when it differs from the requested one, because a stale
          slug can point anywhere — including back at the source repo.
          Never overrides the self-mirror refusal.
        type: boolean
        default: false
      mode:
        description: |
          `mirror` (default): split `source-prefix`, force-push it to the
          mirror's main, tag it `tag`, sync the description and settings.

          `tag-only`: for a nested Go module whose tree already ships inside
          an existing mirror (e.g. `sdk/go` inside the root mirror). Pushes
          ONE tag, `<tag-prefix><tag>`, at the mirror commit whose
          `<tag-prefix>` subtree equals this commit's `source-prefix` tree.
          Never pushes a branch, never moves an existing tag, never touches
          the mirror's description, settings or releases, and never creates
          the mirror. The mirror commit comes from the release that mirrors
          the enclosing tree: tag that component at this commit (or any
          commit with the same module tree) no later than this one. The job
          waits up to `wait-seconds` for its mirror push to land.
        type: string
        default: mirror
      tag-prefix:
        description: |
          `tag-only` mode: path of the module on the mirror, which is also
          the tag prefix Go expects (`sdk/go/` -> tag `sdk/go/v1.2.3`).
          Required in `tag-only` mode; rejected in `mirror` mode.
          Repo-relative, no `.`/`..` components; surrounding whitespace,
          duplicate and trailing slashes are normalised (one `/` joins it
          to the tag).
        type: string
        default: ""
      wait-seconds:
        description: |
          `tag-only` mode: how long to keep polling the mirror for the
          matching commit when it is not there yet (the enclosing release
          may be mirroring in a parallel run). 0 checks once.
        type: number
        default: 600
    secrets:
      GH_MIRROR_PAT:
        description: PAT with admin+contents write on the mirror repo
        required: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_MIRROR_PAT }}
      TARGET: ${{ inputs.target-repo }}
      PREFIX: ${{ inputs.source-prefix }}
      TARGET_PREFIX: ${{ inputs.target-prefix }}
      TAG: ${{ inputs.tag }}
      HOMEPAGE: ${{ inputs.homepage }}
      DESCRIPTION: ${{ inputs.description }}
      CHANGELOG: ${{ inputs.changelog-path }}
      MODE: ${{ inputs.mode }}
      TAG_PREFIX: ${{ inputs.tag-prefix }}
    steps:
      - name: Check mode inputs
        run: |
          case "$MODE" in
            mirror)
              if [ -n "$(printf '%s' "$TAG_PREFIX" | tr -d '[:space:]')" ]; then
                echo "::error::tag-prefix ('$TAG_PREFIX') is only valid with mode: tag-only; mode: mirror tags the mirror with the plain version"
                exit 1
              fi
              ;;
            tag-only)
              if [ -z "$(printf '%s' "$TAG_PREFIX" | tr -d '[:space:]/')" ]; then
                echo "::error::mode: tag-only needs tag-prefix (the module's path on the mirror, e.g. 'sdk/go/')"
                exit 1
              fi
              ;;
            *)
              echo "::error::mode must be 'mirror' or 'tag-only', got '$MODE'"
              exit 1
              ;;
          esac

      - name: Resolve target repo and refuse self-mirror
        id: target
        # Defense-in-depth: if `target-repo` points at the source repo, the
        # mirror push would force-replace its main with a workflows-stripped
        # tree and overwrite its description. Comparing the input string is
        # not enough: a renamed repo leaves a redirect behind, so an old slug
        # (`hop-top/nerv` after a rename to `hop-top/poly-nerv`) still
        # reaches the source repo. Resolve the real name through the API,
        # which follows redirects, and compare that. Any other redirect is
        # refused too unless `allow-target-redirect` opts in. Later steps use
        # the resolved name ($MIRROR_REPO). See
        # https://github.com/hop-top/.github/issues/27.
        env:
          ALLOW_REDIRECT: ${{ inputs.allow-target-redirect }}
        run: |
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          if [ "$(lower "$TARGET")" = "$(lower "$GITHUB_REPOSITORY")" ]; then
            echo "::error::Refusing self-mirror: target-repo ($TARGET) equals github.repository ($GITHUB_REPOSITORY). The mirror push would force-replace main with a workflows-stripped tree. Fix the caller's publish.yml so 'mirror' points at the read-only mirror repo, not the source."
            exit 1
          fi

          err=$(mktemp)
          if RESOLVED=$(gh api "repos/$TARGET" --jq .full_name 2>"$err"); then
            :
          elif grep -q 'HTTP 404' "$err"; then
            if [ "$MODE" = "tag-only" ]; then
              echo "::error::target-repo $TARGET does not exist. mode: tag-only tags an existing mirror and never creates one; release the component that mirrors the enclosing tree first."
              exit 1
            fi
            # Missing mirror: the next step creates it under the requested
            # name. A 404 cannot be a redirect, so there is nothing to follow.
            echo "::notice::target-repo $TARGET does not exist yet; it will be created"
            RESOLVED="$TARGET"
          else
            cat "$err" >&2
            echo "::error::Could not resolve target-repo $TARGET (gh api repos/$TARGET failed). Refusing to push to a repository whose real name is unknown."
            exit 1
          fi
          if [ -z "$RESOLVED" ]; then
            echo "::error::gh api repos/$TARGET returned no full_name. Refusing to push to a repository whose real name is unknown."
            exit 1
          fi

          if [ "$(lower "$RESOLVED")" = "$(lower "$GITHUB_REPOSITORY")" ]; then
            echo "::error::Refusing self-mirror: target-repo $TARGET redirects to $RESOLVED, which is this repository (github.repository $GITHUB_REPOSITORY). The slug is a rename redirect left by renaming this repo; pushing would force-replace this repo's main and overwrite its description. Point 'mirror' at the real read-only mirror repo."
            exit 1
          fi
          if [ "$(lower "$RESOLVED")" != "$(lower "$TARGET")" ]; then
            if [ "$ALLOW_REDIRECT" != "true" ]; then
              echo "::error::target-repo $TARGET redirects to $RESOLVED (the repo was renamed or transferred). Refusing to push through a redirect. Set 'mirror' to $RESOLVED, or opt in with allow-target-redirect: true."
              exit 1
            fi
            echo "::warning::target-repo $TARGET redirects to $RESOLVED; allow-target-redirect is set, pushing to $RESOLVED"
          fi

          echo "Mirror target: $RESOLVED"
          echo "MIRROR_REPO=$RESOLVED" >> "$GITHUB_ENV"
          echo "repo=$RESOLVED" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure mirror repository exists
        if: inputs.mode == 'mirror'
        run: |
          gh repo view "$MIRROR_REPO" >/dev/null 2>&1 || \
            gh repo create "$MIRROR_REPO" \
              --public \
              --disable-issues \
              --disable-wiki \
              --homepage "$HOMEPAGE" \
              --description "$DESCRIPTION"

      - name: Make mirror writable for sync
        if: inputs.mode == 'mirror'
        run: |
          gh api -X PATCH "repos/$MIRROR_REPO" \
            -F archived=false \
            -F has_issues=false \
            -F has_wiki=false \
            -F has_projects=false \
            -F has_discussions=false \
            -F homepage="$HOMEPAGE" \
            -F description="$DESCRIPTION"

      - name: Split subtree and push
        if: inputs.mode == 'mirror'
        run: |
          # commit-tree with HEAD's metadata so the mirror commit reads as
          # a faithful copy (same author, date, message). Used by both the
          # root-component branch and the target-prefix graft.
          commit_with_head_metadata() {
            GIT_AUTHOR_NAME=$(git log -1 --format='%an' HEAD) \
            GIT_AUTHOR_EMAIL=$(git log -1 --format='%ae' HEAD) \
            GIT_AUTHOR_DATE=$(git log -1 --format='%aI' HEAD) \
            GIT_COMMITTER_NAME=$(git log -1 --format='%cn' HEAD) \
            GIT_COMMITTER_EMAIL=$(git log -1 --format='%ce' HEAD) \
            GIT_COMMITTER_DATE=$(git log -1 --format='%cI' HEAD) \
            git commit-tree "$1" -m "$(git log -1 --format='%B' HEAD)"
          }

          # Normalise `target-prefix` up front so both the graft below and
          # the error paths agree on one value. `read-tree --prefix` wants
          # exactly "some/path/" and is unforgiving about anything else, so
          # a malformed value would silently produce a wrong tree instead
          # of failing. Trim surrounding whitespace, collapse duplicate
          # slashes, drop trailing slashes.
          TP=$(printf '%s' "$TARGET_PREFIX" \
            | tr -s '/' \
            | sed -e 's#^[[:space:]]*##' -e 's#[[:space:]]*$##' -e 's#/*$##')
          if [ -n "$TP" ]; then
            # Reject rather than guess: an absolute path, a parent traversal
            # or a bare `.` component all mean the caller intended something
            # this input cannot express. Note the `..`/`.` test brackets $TP
            # with slashes so it matches whole path components only — a dot
            # inside a name ("v0.1", "a..b") stays legal.
            case "$TARGET_PREFIX" in
              /*)
                echo "::error::target-prefix must be repo-relative, got absolute path '$TARGET_PREFIX'"
                exit 1
                ;;
            esac
            case "/$TP/" in
              */../* | */./*)
                echo "::error::target-prefix must not contain '.' or '..' path components, got '$TARGET_PREFIX'"
                exit 1
                ;;
            esac
            echo "Grafting published tree under '${TP}/' on the mirror"
          fi

          # For root-level components (PREFIX="."), there's no subtree to
          # split — synthesize a commit whose tree mirrors HEAD but excludes
          # .github/workflows/. Two reasons:
          # 1) git subtree split refuses to operate on the repo root with
          #    'fatal: . does not exist'.
          # 2) Mirror repos are read-only; pushing the source repo's CI
          #    workflows triggers the GH_MIRROR_PAT 'workflow' scope guard
          #    ('refusing to allow a Personal Access Token to create or
          #    update workflow ... without `workflow` scope') and would
          #    also cause duplicate CI runs if the mirror ever unarchived.
          if [ "$PREFIX" = "." ]; then
            # Build a synthetic tree = HEAD's tree minus .github/workflows
            git read-tree HEAD
            if git ls-files --cached --error-unmatch .github/workflows/ >/dev/null 2>&1; then
              git rm -rf --cached --quiet .github/workflows/
            fi
            TREE=$(git write-tree)
            SHA=$(commit_with_head_metadata "$TREE")
          else
            SHA=$(git subtree split --prefix="$PREFIX" HEAD)
          fi

          # Graft: re-root the payload under $TP on the mirror. Read the
          # tree we just produced into a SCRATCH index at $TP/, then write
          # it back out — a pure object-store operation, so no file copying
          # and the checkout's own index is never touched. Building on
          # $SHA's tree (rather than HEAD:$PREFIX) means this composes with
          # both branches above, root component included.
          #
          # History does not survive the graft: `subtree split` synthesises
          # a rewritten history whose every tree is rooted at the split
          # prefix, and re-rooting only the tip would leave the parents
          # describing a different layout. A single commit carrying HEAD's
          # metadata is the honest representation, and matches what the
          # root-component branch already publishes.
          if [ -n "$TP" ]; then
            GRAFT_INDEX="$(mktemp -d)/index"
            GIT_INDEX_FILE="$GRAFT_INDEX" git read-tree --prefix="${TP}/" "${SHA}^{tree}"
            GRAFT_TREE=$(GIT_INDEX_FILE="$GRAFT_INDEX" git write-tree)
            SHA=$(commit_with_head_metadata "$GRAFT_TREE")
            echo "Grafted tree $GRAFT_TREE -> commit $SHA"
          fi

          git remote add mirror "https://x-access-token:${GH_TOKEN}@github.com/${MIRROR_REPO}.git"
          git push mirror "${SHA}:refs/heads/main" --force
          git tag "$TAG" "$SHA"
          git push mirror "$TAG" --force

      - name: Tag nested module on existing mirror
        if: inputs.mode == 'tag-only'
        env:
          WAIT_SECONDS: ${{ inputs.wait-seconds }}
          POLL_SECONDS: "30"
        run: |
          # Normalise both paths the way target-prefix is normalised: trim
          # whitespace, collapse duplicate slashes, drop leading `./` and
          # trailing slashes; reject absolute paths and `.`/`..` components.
          norm() {
            printf '%s' "$1" | tr -s '/' \
              | sed -e 's#^[[:space:]]*##' -e 's#[[:space:]]*$##' -e 's#^\(\./\)*##' -e 's#/*$##'
          }
          check_path() { # name raw normalised
            case "$2" in
              /*) echo "::error::$1 must be repo-relative, got absolute path '$2'"; exit 1 ;;
            esac
            case "/$3/" in
              */../* | */./* | //)
                echo "::error::$1 must name a subdirectory without '.' or '..' components, got '$2'"; exit 1 ;;
            esac
          }
          MPATH=$(norm "$TAG_PREFIX")
          SPATH=$(norm "$PREFIX")
          check_path tag-prefix "$TAG_PREFIX" "$MPATH"
          check_path source-prefix "$PREFIX" "$SPATH"
          NESTED_TAG="${MPATH}/${TAG}"

          # The module's tree at this commit. Go builds a nested module's
          # zip from that subdirectory alone, so the mirror commit to tag
          # is any whose <tag-prefix> subtree is this exact tree: matching
          # by content needs no stored source->mirror mapping and holds for
          # every way the enclosing tree is mirrored (root split, subtree
          # split, target-prefix graft).
          SRC_TREE=$(git rev-parse --verify -q "HEAD:${SPATH}" || true)
          if [ -z "$SRC_TREE" ] || [ "$(git cat-file -t "$SRC_TREE")" != tree ]; then
            echo "::error::source-prefix '$PREFIX' is not a directory at $(git rev-parse HEAD)"
            exit 1
          fi
          echo "Looking for a commit on $MIRROR_REPO whose ${MPATH}/ is tree $SRC_TREE (source ${SPATH}/ at $(git rev-parse --short HEAD))"

          url="https://x-access-token:${GH_TOKEN}@github.com/${MIRROR_REPO}.git"
          git remote add mirror "$url" 2>/dev/null || git remote set-url mirror "$url"
          scratch=$(mktemp -d)

          # Newest first. Every ref counts: a root mirror force-pushes one
          # parentless commit per release, so older releases are reachable
          # only from their tags.
          find_match() {
            git for-each-ref --format='%(objectname)' refs/mirror/ \
              | git rev-list --date-order --stdin > "$scratch/commits"
            awk -v p="$MPATH" '{ print $0 ":" p }' "$scratch/commits" \
              | git cat-file --batch-check='%(objectname)' > "$scratch/trees"
            paste -d' ' "$scratch/commits" "$scratch/trees" \
              | awk -v t="$SRC_TREE" '$2 == t && !found { print $1; found = 1 }'
          }

          start=$(date +%s)
          while :; do
            git fetch --quiet --no-tags mirror \
              '+refs/heads/*:refs/mirror/heads/*' '+refs/tags/*:refs/mirror/tags/*'

            # Go module versions are immutable once the proxy has seen
            # them: an existing tag is fine only where it already is.
            if existing=$(git rev-parse --verify -q "refs/mirror/tags/${NESTED_TAG}^{commit}"); then
              if [ "$(git rev-parse --verify -q "${existing}:${MPATH}")" = "$SRC_TREE" ]; then
                echo "::notice::$MIRROR_REPO already has $NESTED_TAG at $existing with this tree; nothing to do"
                exit 0
              fi
              echo "::error::$MIRROR_REPO already has $NESTED_TAG at $existing, whose ${MPATH}/ differs from source ${SPATH}/ at $(git rev-parse --short HEAD). Refusing to move a published Go module tag; release a new version instead."
              exit 1
            fi

            MATCH=$(find_match)
            [ -n "$MATCH" ] && break

            elapsed=$(( $(date +%s) - start ))
            if [ "$elapsed" -ge "$WAIT_SECONDS" ]; then
              echo "::error::No commit on $MIRROR_REPO has ${MPATH}/ equal to source ${SPATH}/ at $(git rev-parse --short HEAD) (tree $SRC_TREE) after ${elapsed}s. Release the component that mirrors the enclosing tree to $MIRROR_REPO at a commit with this module tree (this one, say) and no later than this tag, then re-run. Rule: tag the enclosing component no later than the nested module."
              exit 1
            fi
            echo "No matching mirror commit yet (${elapsed}s/${WAIT_SECONDS}s); retrying in ${POLL_SECONDS}s"
            sleep "$POLL_SECONDS"
          done

          echo "Tagging $MIRROR_REPO $MATCH as $NESTED_TAG"
          # Not forced: never move a tag someone pushed in the meantime.
          git push mirror "${MATCH}:refs/tags/${NESTED_TAG}"

      - name: Create release on mirror
        if: inputs.mode == 'mirror' && inputs.create-release
        run: |
          BODY=""
          # Root component: changelog lives at repo root, not under a subdir
          if [ "$PREFIX" = "." ]; then
            CHANGELOG_PATH="$CHANGELOG"
          else
            CHANGELOG_PATH="${PREFIX}/${CHANGELOG}"
          fi
          if [ -f "$CHANGELOG_PATH" ]; then
            BODY=$(sed -n '/^## \[/,/^## \[/{ /^## \[/!p; }' "$CHANGELOG_PATH" | head -50)
          fi
          # Mirror the tag's channel: anything with a prerelease identifier
          # (alpha/beta/rc/experimental/...) is not a stable release.
          PRERELEASE_FLAG=""
          if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.]+$ ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # `create` 422s if $TAG was already released (e.g. release-please
          # or a manual retry force-moved the tag to a new commit) — that
          # error used to be swallowed by `|| true`, leaving the mirror's
          # release notes frozen at the first version forever while the
          # tag/main silently moved on. Fall back to `edit` so a retag
          # actually refreshes the release.
          if ! gh release create "$TAG" \
                --repo "$MIRROR_REPO" \
                --title "$TAG" \
                --notes "${BODY:-Release $TAG}" \
                --latest=false \
                $PRERELEASE_FLAG 2>/tmp/mirror-release-create.err; then
            if grep -q "already exists" /tmp/mirror-release-create.err; then
              echo "Tag already released on mirror — updating existing release"
              gh release edit "$TAG" \
                --repo "$MIRROR_REPO" \
                --title "$TAG" \
                --notes "${BODY:-Release $TAG}" \
                $PRERELEASE_FLAG
            else
              cat /tmp/mirror-release-create.err >&2
              exit 1
            fi
          fi

      - name: Restore mirror read-only
        # The has_*=false fields below disable every human-input surface
        # (issues / wiki / projects / discussions). `archived: true` was
        # dropped deliberately — to human readers, an archived repo reads
        # as "abandoned, do not rely on", which contradicts the mirror's
        # actual role as the canonical install slot for vanity imports
        # (`go install hop.top/uri@latest` resolves here).
        # See https://github.com/hop-top/.github/issues/27.
        #
        # Only once the target resolved: after a refused self-mirror or
        # redirect there is no verified mirror, and patching the requested
        # slug would land on the repo the refusal protects.
        if: always() && inputs.mode == 'mirror' && steps.target.outputs.repo != ''
        run: |
          gh api -X PATCH "repos/$MIRROR_REPO" \
            -F has_issues=false \
            -F has_wiki=false \
            -F has_projects=false \
            -F has_discussions=false
