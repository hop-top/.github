name: release-please-on-push (reusable)

# Runs release-please for an adopter repo: keeps the standing release
# PR(s) current and, once one merges, cuts the tag + GitHub Release.
# One shared implementation of the job every hop-top repo used to
# hand-roll in its own release-please.yml.
#
# What it adds over a hand-rolled job:
#
#   - Concurrency guard. One release-please run per branch, newest
#     push wins. A run that started before a release PR merged still
#     sees the old latest release; if it finishes after the merge it
#     no longer finds that PR open and re-opens a release PR for the
#     version just tagged. Cancelling it on the next push closes that
#     window. The guard is JOB-level on purpose: in a called workflow
#     that is the supported place (`github.ref` resolves to the
#     caller's ref), and it cancels only the stale release-please job,
#     never a publish job the caller chained on an earlier run's
#     outputs. The group name is distinct from the
#     `release-please-${{ github.ref }}` group hand-written callers
#     carry — equal caller/callee groups with cancel-in-progress cancel
#     the run itself — so a caller keeping its own guard stays safe.
#   - release-bot App token (release PRs authored by release-bot[bot]:
#     they trigger downstream workflows, and sidestep the CODEOWNERS
#     self-approval block on the manifest). GITHUB_TOKEN stays
#     read-only.
#   - Config check: a missing / malformed config or manifest fails with
#     the path named instead of release-please's generic error. A repo
#     with NEITHER file (wired, not yet adopted — e.g. fresh from
#     `kit init`) gets a warning and a skipped run instead of a red one.
#   - target-branch defaults to the branch that triggered the run, so a
#     caller pushing on several integration branches (main + next)
#     releases each against itself.
#   - Opt-in target versioning (`versioning-extension: true`): the run
#     uses this repository's release-please extension
#     (scripts/release-please-target, release-please pinned exactly)
#     through an action-equivalent runner instead of
#     googleapis/release-please-action — same inputs, secrets and
#     outputs. Required by a config using `versioning: "target"`; see
#     references/how-to/target-versioning.md. The extension is checked
#     out at this workflow's own commit (`job.workflow_sha`), so the
#     runner and the workflow always ship together; `tooling-ref` is the
#     fallback when the runner does not expose that SHA (a git ref or
#     SHA, one line; anything else fails the step). A run that leaves a
#     package blocked (feat on a release/x.y branch, a linked group that
#     cannot move, a change needing more than the rc) fails after every
#     package was processed: a caller chaining jobs on the outputs should
#     gate them on `!cancelled()` as well. A package the branch does not
#     release (an alpha/beta on the stable branch) is a notice only.
#
# Caller template (.github/workflows/release-please.yml):
#
#   name: release-please
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch: {}
#   permissions:
#     contents: read
#   jobs:
#     release-please:
#       uses: hop-top/.github/.github/workflows/release-please-on-push.yml@v0
#       secrets:
#         RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
#         RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
#       # with:
#       #   versioning-extension: true   # config uses versioning "target"
#
# Chaining a publish job on the outputs (in the caller). Outputs keep
# release-please-action's names; per-path outputs of a manifest with
# several packages (`<path>--release_created`, ...) are in `json`:
#
#     publish:
#       needs: release-please
#       if: needs.release-please.outputs.releases_created == 'true'
#       # or: fromJSON(needs.release-please.outputs.json)['ts--release_created']

on:
  workflow_call:
    inputs:
      config-file:
        description: Path to release-please-config.json
        type: string
        default: .github/release-please-config.json
      manifest-file:
        description: Path to .release-please-manifest.json
        type: string
        default: .github/.release-please-manifest.json
      target-branch:
        description: |
          Branch release PRs are opened against. Empty (default) = the
          branch that triggered the caller (`github.ref_name`).
        type: string
        default: ""
      versioning-extension:
        description: |
          Run release-please with hop-top/.github's target-versioning
          extension (scripts/release-please-target) instead of
          googleapis/release-please-action. Needed when the config uses
          `versioning: "target"`. Same inputs, secrets and outputs.
        type: boolean
        default: false
      tooling-ref:
        description: Ref of hop-top/.github to check the extension out at when the runner does not expose the running workflow's SHA (normally never used; only read with versioning-extension)
        type: string
        default: v0
    secrets:
      RELEASE_BOT_APP_ID:
        required: true
        description: GitHub App ID of the hop-top release-bot (see references/secrets.md)
      RELEASE_BOT_PRIVATE_KEY:
        required: true
        description: Private key paired with RELEASE_BOT_APP_ID
    outputs:
      releases_created:
        description: "'true' when any release was created by this run"
        value: ${{ jobs.release-please.outputs.releases_created }}
      paths_released:
        description: JSON array of the package paths released by this run
        value: ${{ jobs.release-please.outputs.paths_released }}
      prs_created:
        description: "'true' when any release PR was created or updated"
        value: ${{ jobs.release-please.outputs.prs_created }}
      pr:
        description: JSON of the (first) release PR
        value: ${{ jobs.release-please.outputs.pr }}
      prs:
        description: JSON array of the release PRs
        value: ${{ jobs.release-please.outputs.prs }}
      release_created:
        description: "'true' when the root package (`.`) was released"
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: Tag of the root package's release
        value: ${{ jobs.release-please.outputs.tag_name }}
      version:
        description: Version of the root package's release
        value: ${{ jobs.release-please.outputs.version }}
      major:
        description: Major version of the root package's release
        value: ${{ jobs.release-please.outputs.major }}
      minor:
        description: Minor version of the root package's release
        value: ${{ jobs.release-please.outputs.minor }}
      patch:
        description: Patch version of the root package's release
        value: ${{ jobs.release-please.outputs.patch }}
      sha:
        description: Commit the root package's release was tagged at
        value: ${{ jobs.release-please.outputs.sha }}
      upload_url:
        description: Asset upload URL of the root package's release
        value: ${{ jobs.release-please.outputs.upload_url }}
      html_url:
        description: Web URL of the root package's release
        value: ${{ jobs.release-please.outputs.html_url }}
      json:
        description: |
          Every release-please-action output as a JSON object, including
          the per-path ones (`<path>--release_created`, `<path>--tag_name`,
          ...). Read with `fromJSON(...)['<path>--<output>']`.
        value: ${{ jobs.release-please.outputs.json }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: release-please-on-push-${{ github.ref }}
      cancel-in-progress: true
    # Exactly one of `release` (the action) and `target` (the extension
    # runner) runs; each output is whichever one set it.
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created || steps.target.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released || steps.target.outputs.paths_released }}
      prs_created: ${{ steps.release.outputs.prs_created || steps.target.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr || steps.target.outputs.pr }}
      prs: ${{ steps.release.outputs.prs || steps.target.outputs.prs }}
      release_created: ${{ steps.release.outputs.release_created || steps.target.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.target.outputs.tag_name }}
      version: ${{ steps.release.outputs.version || steps.target.outputs.version }}
      major: ${{ steps.release.outputs.major || steps.target.outputs.major }}
      minor: ${{ steps.release.outputs.minor || steps.target.outputs.minor }}
      patch: ${{ steps.release.outputs.patch || steps.target.outputs.patch }}
      sha: ${{ steps.release.outputs.sha || steps.target.outputs.sha }}
      upload_url: ${{ steps.release.outputs.upload_url || steps.target.outputs.upload_url }}
      html_url: ${{ steps.release.outputs.html_url || steps.target.outputs.html_url }}
      json: ${{ inputs.versioning-extension && toJSON(steps.target.outputs) || toJSON(steps.release.outputs) }}
    steps:
      # Only the two files the config check reads.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            ${{ inputs.config-file }}
            ${{ inputs.manifest-file }}
          sparse-checkout-cone-mode: false

      - name: Check release-please config
        id: config
        env:
          CONFIG_FILE: ${{ inputs.config-file }}
          MANIFEST_FILE: ${{ inputs.manifest-file }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
        run: |
          set -euo pipefail
          if [[ ! -e "$CONFIG_FILE" && ! -e "$MANIFEST_FILE" ]]; then
            echo "::warning file=$CONFIG_FILE::no release-please config ($CONFIG_FILE) or manifest ($MANIFEST_FILE) — skipping release-please until both exist"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          fail=0
          for f in "$CONFIG_FILE" "$MANIFEST_FILE"; do
            if [[ ! -f "$f" ]]; then
              echo "::error file=$f::$f not found — release-please needs both the config and the manifest (pass config-file / manifest-file if they live elsewhere)"
              fail=1
            elif ! jq -e 'type == "object"' "$f" >/dev/null 2>&1; then
              echo "::error file=$f::$f is not a JSON object"
              fail=1
            fi
          done
          if [[ $fail -eq 0 ]] && ! jq -e '(.packages // {}) | length > 0' "$CONFIG_FILE" >/dev/null; then
            echo "::error file=$CONFIG_FILE::$CONFIG_FILE declares no packages"
            fail=1
          fi
          [[ $fail -eq 0 ]] || exit 1

          branch="${TARGET_BRANCH:-$GITHUB_REF_NAME}"
          {
            echo "skip=false"
            echo "target-branch=$branch"
          } >> "$GITHUB_OUTPUT"
          echo "release-please: config=$CONFIG_FILE manifest=$MANIFEST_FILE target-branch=$branch"

      - uses: actions/create-github-app-token@v3
        if: steps.config.outputs.skip != 'true'
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        if: steps.config.outputs.skip != 'true' && !inputs.versioning-extension
        id: release
        with:
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          target-branch: ${{ steps.config.outputs.target-branch }}
          token: ${{ steps.app-token.outputs.token }}

      # ---- versioning-extension: true ------------------------------------
      - name: Resolve the shared tooling revision
        if: steps.config.outputs.skip != 'true' && inputs.versioning-extension
        id: tooling
        # The reusable workflow's own commit is the revision of hop-top/.github
        # to run the extension from. GitHub documents it as job.workflow_sha /
        # job.workflow_repository, but actionlint types the `job` context
        # strictly (container, services, status only) and rejects those as
        # property accesses; toJSON(job) passes the type check and jq reads
        # the keys at run time.
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
          FALLBACK_REF: ${{ inputs.tooling-ref }}
        run: |
          set -euo pipefail
          sha=$(jq -r '.workflow_sha // empty' <<<"$JOB_CONTEXT")
          repo=$(jq -r '.workflow_repository // empty' <<<"$JOB_CONTEXT")
          if [ -z "$sha" ]; then
            echo "::warning::job.workflow_sha is empty on this runner; checking out the shared tooling at '$FALLBACK_REF' instead"
            sha="$FALLBACK_REF"
          fi
          [ -n "$repo" ] || repo="hop-top/.github"
          # One line each, git-ref / owner/repo characters only: a newline in
          # tooling-ref would add outputs of its own.
          if [[ ! "$sha" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo "::error::tooling-ref / job.workflow_sha is not a git ref or SHA: $(printf '%q' "$sha")"
            exit 1
          fi
          if [[ ! "$repo" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::job.workflow_repository is not owner/repo: $(printf '%q' "$repo")"
            exit 1
          fi
          echo "Shared tooling: $repo@$sha"
          { echo "repository=$repo"; echo "ref=$sha"; } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.config.outputs.skip != 'true' && inputs.versioning-extension
        with:
          repository: ${{ steps.tooling.outputs.repository }}
          ref: ${{ steps.tooling.outputs.ref }}
          path: .hop-top-dotgithub
          persist-credentials: false
          sparse-checkout: scripts/release-please-target

      - uses: actions/setup-node@v7
        if: steps.config.outputs.skip != 'true' && inputs.versioning-extension
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .hop-top-dotgithub/scripts/release-please-target/package-lock.json

      # Lockfile install: release-please at the exact version the extension
      # was tested against (its contract test gates every upgrade).
      - name: Install the target-versioning extension
        if: steps.config.outputs.skip != 'true' && inputs.versioning-extension
        working-directory: .hop-top-dotgithub/scripts/release-please-target
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Same inputs as the action step above (its defaults included), same
      # outputs (written to GITHUB_OUTPUT by the runner).
      - name: release-please (target versioning)
        if: steps.config.outputs.skip != 'true' && inputs.versioning-extension
        id: target
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          REPO_URL: ${{ github.repository }}
          TARGET_BRANCH: ${{ steps.config.outputs.target-branch }}
          CONFIG_FILE: ${{ inputs.config-file }}
          MANIFEST_FILE: ${{ inputs.manifest-file }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_GRAPHQL_URL: ${{ github.graphql_url }}
          CHANGELOG_HOST: ${{ github.server_url }}
        run: node .hop-top-dotgithub/scripts/release-please-target/bin/run.js
