name: roll-major-tag

# When a stable version tag (vMAJOR.MINOR.PATCH) is pushed, force-move
# the matching major tag (vMAJOR) to the same commit. Consumers
# pin `@v0` / `@v1` etc. and auto-receive non-breaking updates.
# A tag with a prerelease suffix or build metadata (v0.15.0-rc.1,
# v0.15.0+build.1) still triggers a run, which leaves vMAJOR where it
# is with a notice: `@v0` callers never run a prerelease.
#
# Manually trigger via workflow_dispatch with `version` input to
# bootstrap or backfill (e.g. dispatch with version=v0.1.0).

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: "Existing stable version tag to roll the major tag for (e.g. v0.1.0)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  roll:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_RELEASE_PLEASE_PAT }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version tag
        id: ver
        env:
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            TAG="$INPUT_VERSION"
          else
            TAG="${REF#refs/tags/}"
          fi
          if ! [[ "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::tag '$TAG' does not match vMAJOR.MINOR.PATCH pattern"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::notice::tag '$TAG' is not a stable vMAJOR.MINOR.PATCH (prerelease, build metadata or leading zeros): v$MAJOR stays where it is"
            echo "roll=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "roll=true"
            echo "tag=$TAG"
            echo "major=v$MAJOR"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$TAG, major=v$MAJOR"

      - name: Resolve commit SHA for the version tag
        id: sha
        if: steps.ver.outputs.roll == 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          REF_JSON=$(gh api "repos/$REPO/git/refs/tags/$TAG")
          SHA=$(echo "$REF_JSON" | jq -r '.object.sha')
          TYPE=$(echo "$REF_JSON" | jq -r '.object.type')
          if [ "$TYPE" = "tag" ]; then
            SHA=$(gh api "repos/$REPO/git/tags/$SHA" --jq '.object.sha')
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Commit SHA for $TAG: $SHA"

      - name: Force-update major tag
        if: steps.ver.outputs.roll == 'true'
        env:
          MAJOR: ${{ steps.ver.outputs.major }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          # Existence probe: GET /git/ref/tags/<NAME> (singular `ref`).
          # The plural `refs` form does prefix matching and returns
          # an array — would falsely "exist" when v0.1.0 matches v0.
          if gh api "repos/$REPO/git/ref/tags/$MAJOR" --silent 2>/dev/null; then
            echo "Tag $MAJOR exists, updating..."
            RESULT=$(gh api -X PATCH "repos/$REPO/git/refs/tags/$MAJOR" \
              -F sha="$SHA" -F force=true)
            if NEW_SHA=$(echo "$RESULT" | jq -er '.object.sha' 2>/dev/null); then
              echo "Updated $MAJOR -> $NEW_SHA"
            else
              echo "::error::PATCH failed: $RESULT"
              exit 1
            fi
          else
            echo "Tag $MAJOR does not exist, creating..."
            RESULT=$(gh api -X POST "repos/$REPO/git/refs" \
              -f ref="refs/tags/$MAJOR" -f sha="$SHA")
            if NEW_SHA=$(echo "$RESULT" | jq -er '.object.sha' 2>/dev/null); then
              echo "Created $MAJOR -> $NEW_SHA"
            else
              echo "::error::POST failed: $RESULT"
              exit 1
            fi
          fi
