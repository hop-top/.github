name: publish-py (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: Path to the Python package (where pyproject.toml lives)
        type: string
        required: true
      python-version:
        description: Python version for build+publish
        type: string
        default: "3.11"
      test-command:
        description: Test command (runs from working-directory). Empty uses default.
        type: string
        default: ""
      build-command:
        description: Build command (must populate dist/). Empty uses default.
        type: string
        default: ""
      pypi-environment:
        description: GitHub Environment for trusted publishing (OIDC mode only)
        type: string
        default: pypi
      pypi-auth:
        description: |
          Authentication mode for PyPI publish. `oidc` (default) uses
          trusted publishing via the `pypi-environment` binding. `token`
          uses an API token from the `PYPI_REGISTRY_TOKEN` secret and
          skips the GitHub Environment binding entirely.
        type: string
        default: oidc
    secrets:
      PYPI_REGISTRY_TOKEN:
        description: 'PyPI API token. Required when `pypi-auth: token`.'
        required: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate pypi-auth
        env:
          PYPI_AUTH: ${{ inputs.pypi-auth }}
        run: |
          case "$PYPI_AUTH" in
            oidc|token) echo "pypi-auth=$PYPI_AUTH (ok)" ;;
            *) echo "::error::Invalid pypi-auth=$PYPI_AUTH. Must be 'oidc' or 'token'." >&2; exit 1 ;;
          esac

  publish-oidc:
    needs: validate
    if: ${{ inputs.pypi-auth == 'oidc' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.pypi-environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - run: python -m pip install -U pip pytest build
      - name: Test
        working-directory: ${{ inputs.working-directory }}
        env:
          TEST_CMD: ${{ inputs.test-command || 'python -m pytest -q' }}
        run: bash -c "$TEST_CMD"
      - name: Build
        working-directory: ${{ inputs.working-directory }}
        env:
          BUILD_CMD: ${{ inputs.build-command || 'python -m build' }}
        run: bash -c "$BUILD_CMD"
      - name: Publish (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ inputs.working-directory }}/dist/

  publish-token:
    needs: validate
    if: ${{ inputs.pypi-auth == 'token' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify PYPI_REGISTRY_TOKEN secret is set
        env:
          TOKEN: ${{ secrets.PYPI_REGISTRY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::pypi-auth=token requires the PYPI_REGISTRY_TOKEN secret. Caller must pass it through in the publish-on-tag workflow_call secrets block." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - run: python -m pip install -U pip pytest build
      - name: Test
        working-directory: ${{ inputs.working-directory }}
        env:
          TEST_CMD: ${{ inputs.test-command || 'python -m pytest -q' }}
        run: bash -c "$TEST_CMD"
      - name: Build
        working-directory: ${{ inputs.working-directory }}
        env:
          BUILD_CMD: ${{ inputs.build-command || 'python -m build' }}
        run: bash -c "$BUILD_CMD"
      - name: Publish (API token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ inputs.working-directory }}/dist/
          password: ${{ secrets.PYPI_REGISTRY_TOKEN }}
