[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "well-known-publisher"
version = "0.1.0"
description = "Generate /.well-known/* resource files from a single YAML config."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "hop-top" }]
keywords = ["well-known", "rfc8615", "github-actions"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "ruamel.yaml>=0.18,<0.19",
    "jsonschema>=4.21,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
]

[project.scripts]
well-known-publisher = "well_known_publisher.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
well_known_publisher = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
