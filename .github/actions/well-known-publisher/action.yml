name: well-known publisher
description: |
  EXPERIMENTAL; interface may change. Generate /.well-known/* files from a
  single YAML config. Today it validates the config and writes `custom:`
  entries; per-resource generators (security.txt, assetlinks.json, ...) are
  not implemented yet. Deploying is left to the caller workflow.
author: hop-top

inputs:
  config-path:
    description: Path to the YAML config file driving generation.
    required: false
    default: .github/well-known.yaml
  output-dir:
    description: |
      Directory where generated files are written. When omitted, the
      generator falls back to the config file's ``output_dir`` (or the
      schema default ``dist/.well-known`` when that is also unset).
    required: false
  env-allowlist:
    description: |
      Comma- or newline-separated env var names the config's env
      placeholders (env.NAME in double braces) may read. Empty (the
      default) means no placeholder interpolates: any reference fails the
      run, so tokens in the job environment cannot reach a published file.
    required: false
    default: ''

outputs:
  files_written:
    description: Newline-separated list of paths the generators emitted.
    value: ${{ steps.generate.outputs.files_written }}
  manifest:
    description: |
      JSON array summarising each generator run; shape is
      [{generator: str, files: [str], warnings: int}, ...].
    value: ${{ steps.generate.outputs.manifest }}

runs:
  using: composite
  steps:
    # update-environment: false keeps this interpreter off PATH and out of
    # the job env, so the caller's later steps see their own Python.
    - name: Setup Python
      id: python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        update-environment: false

    # Private venv under RUNNER_TEMP; deps come from the hash-pinned,
    # wheels-only requirements.txt. pip is the venv's bundled one.
    - name: Install generator dependencies
      id: venv
      shell: bash
      env:
        WKP_PYTHON: ${{ steps.python.outputs.python-path }}
      run: |
        venv="${RUNNER_TEMP}/well-known-publisher-venv"
        "${WKP_PYTHON}" -m venv "${venv}"
        if [ -x "${venv}/bin/python" ]; then
          py="${venv}/bin/python"
        else
          py="${venv}/Scripts/python.exe"
        fi
        "${py}" -m pip install --disable-pip-version-check --no-input \
          --require-hashes --only-binary :all: \
          -r "${GITHUB_ACTION_PATH}/generator/requirements.txt"
        echo "python=${py}" >> "${GITHUB_OUTPUT}"

    - name: Generate well-known files
      id: generate
      shell: bash
      env:
        WKP_PYTHON: ${{ steps.venv.outputs.python }}
        WKP_CONFIG_PATH: ${{ inputs.config-path }}
        WKP_OUTPUT_DIR: ${{ inputs.output-dir }}
        WKP_ENV_ALLOWLIST: ${{ inputs.env-allowlist }}
      run: |
        args=( --config "${WKP_CONFIG_PATH}" --env-allowlist "${WKP_ENV_ALLOWLIST}" )
        if [ -n "${WKP_OUTPUT_DIR}" ]; then
          args+=( --output-dir "${WKP_OUTPUT_DIR}" )
        fi
        # -P: never import from the caller's working directory.
        PYTHONPATH="${GITHUB_ACTION_PATH}/generator/src" \
          "${WKP_PYTHON}" -P -m well_known_publisher "${args[@]}"
