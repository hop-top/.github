name: well-known publisher
description: |
  Generate /.well-known/* resource files (security.txt, openid-configuration,
  assetlinks.json, etc.) from a single YAML config. Optional deploy step is
  delegated to the caller workflow.
author: hop-top

inputs:
  config_path:
    description: Path to the YAML config file driving generation.
    required: false
    default: .github/well-known.yaml
  output_dir:
    description: Directory where generated files are written.
    required: false
    default: dist/.well-known

outputs:
  files_written:
    description: Newline-separated list of paths the generators emitted.
    value: ${{ steps.generate.outputs.files_written }}
  manifest:
    description: |
      JSON array summarising each generator run; shape is
      [{generator: str, files: [str], warnings: int}, ...].
    value: ${{ steps.generate.outputs.manifest }}

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install generator package
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e "${{ github.action_path }}/generator"

    - name: Generate well-known files
      id: generate
      shell: bash
      env:
        WKP_CONFIG_PATH: ${{ inputs.config_path }}
        WKP_OUTPUT_DIR: ${{ inputs.output_dir }}
      run: |
        python -m well_known_publisher \
          --config "${WKP_CONFIG_PATH}" \
          --output-dir "${WKP_OUTPUT_DIR}"
