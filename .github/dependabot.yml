# Action updates. Dependabot regenerates the matching actions.lock entry in
# the same PR. Org policy (templates/dependabot.yml): one version-update PR at
# a time, updated in place while open; cooldown matches the 14-day age gate;
# security updates immediate. Majors are ignored because a new generation is
# bumped deliberately across all repos.
version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "ci(deps):"

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    multi-ecosystem-group: dependencies
    patterns:
      - "*"
    cooldown:
      default-days: 14
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
